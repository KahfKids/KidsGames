    @import url("/KidsGames/fonts/fonts.css");

    body {
      font-family: "Nunito", sans-serif;
      touch-action: manipulation;
      overflow: hidden;
      user-select: none;
    }

    .balloon {
      position: absolute;
      cursor: pointer;
      animation-name: float;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      transform-origin: bottom center;
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(-2deg);
      }

      50% {
        transform: translateY(-20px) rotate(2deg);
      }

      100% {
        transform: translateY(0) rotate(-2deg);
      }
    }

    .pop-animation {
      animation: pop 0.3s ease-out forwards;
    }

    @keyframes pop {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }

      100% {
        transform: scale(0);
        opacity: 0;
      }
    }

    .game-container {
      background: linear-gradient(to bottom, #64b5f6, #bbdefb);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    .cloud {
      position: absolute;
      opacity: 0.8;
      animation: drift linear infinite;
    }

    @keyframes drift {
      0% {
        transform: translateX(-150px);
      }

      100% {
        transform: translateX(100vw);
      }
    }

    .star-burst {
      position: absolute;
      pointer-events: none;
      animation: starburst 0.5s ease-out forwards;
    }

    @keyframes starburst {
      0% {
        transform: scale(0);
        opacity: 1;
      }

      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

<body class="bg-blue-100">
  <div class="game-container" id="gameContainer">
    <!-- Clouds -->
    <div class="cloud" style="top: 15%; left: -100px; animation-duration: 60s">
      <svg width="100" height="60" viewBox="0 0 100 60" fill="white">
        <path d="M10,40 Q15,20 40,30 Q60,5 80,30 Q95,20 90,40 Q100,55 80,50 Q65,65 50,50 Q35,65 20,50 Q5,55 10,40 Z">
        </path>
      </svg>
    </div>
    <div class="cloud" style="top: 25%; left: -150px; animation-duration: 75s">
      <svg width="120" height="70" viewBox="0 0 120 70" fill="white">
        <path d="M10,40 Q15,20 40,30 Q60,5 80,30 Q95,20 90,40 Q100,55 80,50 Q65,65 50,50 Q35,65 20,50 Q5,55 10,40 Z">
        </path>
      </svg>
    </div>

    <!-- Game UI -->
    <div class="absolute top-0 left-0 right-0 p-4 flex justify-between items-center">
      <div class="bg-white bg-opacity-80 rounded-lg p-3 shadow-lg">
        <p class="text-xl font-bold text-blue-600">
          Score: <span id="score">0</span>
        </p>
      </div>
      <div class="bg-white bg-opacity-80 rounded-lg p-3 shadow-lg">
        <p class="text-xl font-bold text-blue-600">
          Time: <span id="timer">30</span>s
        </p>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen"
      class="hidden fixed inset-0 bg-black bg-opacity-70 flex flex-col items-center justify-center z-50">
      <div class="bg-white rounded-xl p-6 max-w-sm mx-4 text-center shadow-2xl transform transition-all">
        <h2 class="text-3xl font-bold text-blue-600 mb-2">Game Over!</h2>
        <p class="text-xl mb-4">Your score: <span id="finalScore">0</span></p>
        <button id="playAgainBtn"
          class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-full text-lg transition-colors shadow-lg">
          Play Again
        </button>
      </div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen"
      class="fixed inset-0 bg-blue-500 bg-opacity-90 flex flex-col items-center justify-center z-50">
      <div class="bg-white rounded-xl p-6 max-w-sm mx-4 text-center shadow-2xl">
        <h1 class="text-3xl font-bold text-blue-600 mb-2">
          Balloon Pop Adventure
        </h1>
        <p class="text-lg mb-6">
          Pop as many balloons as you can in 30 seconds!
        </p>
        <button id="startBtn"
          class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full text-xl transition-colors shadow-lg">
          Start Game
        </button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const gameContainer = document.getElementById("gameContainer");
      const scoreElement = document.getElementById("score");
      const timerElement = document.getElementById("timer");
      const startScreen = document.getElementById("startScreen");
      const gameOverScreen = document.getElementById("gameOverScreen");
      const finalScoreElement = document.getElementById("finalScore");
      const startBtn = document.getElementById("startBtn");
      const playAgainBtn = document.getElementById("playAgainBtn");

      let score = 0;
      let timeLeft = 30;
      let gameActive = false;
      let balloonInterval;
      let timerInterval;
      let balloons = [];

      const colors = [
        "#FF5252",
        "#FFEB3B",
        "#2196F3",
        "#4CAF50",
        "#9C27B0",
        "#FF9800",
      ];

      function createBalloon() {
        if (!gameActive) return;

        const balloon = document.createElement("div");
        balloon.className = "balloon";

        // Random balloon properties
        const size = Math.floor(Math.random() * 40) + 60; // 60-100px
        const color = colors[Math.floor(Math.random() * colors.length)];
        const left = Math.random() * (window.innerWidth - size);
        const animationDuration = Math.random() * 2 + 2; // 2-4s

        balloon.innerHTML = `
                    <svg width="${size}" height="${size * 1.2
          }" viewBox="0 0 100 120">
                        <path d="M50,10 C20,10 10,40 10,65 C10,90 30,110 50,110 C70,110 90,90 90,65 C90,40 80,10 50,10 Z" fill="${color}" />
                        <path d="M50,110 L45,120 L55,120 Z" fill="#8B4513" />
                    </svg>
                `;

        balloon.style.left = `${left}px`;
        balloon.style.bottom = `-${size}px`;
        balloon.style.animationDuration = `${animationDuration}s`;

        gameContainer.appendChild(balloon);

        // Animate balloon rising
        const speed = Math.random() * 3 + 2; // 2-5 seconds
        let position = -size;

        const rise = setInterval(() => {
          if (!gameActive) {
            clearInterval(rise);
            if (balloon.parentNode) {
              balloon.parentNode.removeChild(balloon);
            }
            return;
          }

          position += 1;
          balloon.style.bottom = `${position}px`;

          // Remove balloon if it goes off screen
          if (position > window.innerHeight + size) {
            clearInterval(rise);
            if (balloon.parentNode) {
              balloon.parentNode.removeChild(balloon);
            }
          }
        }, 10);

        // Add click/touch event
        balloon.addEventListener("pointerdown", () => {
          if (!gameActive || balloon.dataset.popped) return;
          balloon.dataset.popped = "1"; // one point per balloon, even with fast repeat taps

          // Increase score
          score += 1;
          scoreElement.textContent = score;

          // Pop animation
          balloon.classList.add("pop-animation");

          // Create star burst effect
          createStarBurst(balloon.getBoundingClientRect());

          // Remove balloon after animation
          setTimeout(() => {
            if (balloon.parentNode) {
              balloon.parentNode.removeChild(balloon);
            }
            clearInterval(rise);
          }, 300);
        });

        balloons.push({ element: balloon, interval: rise });
      }

      function createStarBurst(rect) {
        const centerX = rect.left + rect.width / 2;
        const centerY = window.innerHeight - rect.bottom + rect.height / 2;

        const burst = document.createElement("div");
        burst.className = "star-burst";
        burst.style.left = `${centerX}px`;
        burst.style.bottom = `${centerY}px`;

        const starSvg = `
                    <svg width="60" height="60" viewBox="0 0 60 60">
                        <text x="30" y="40" text-anchor="middle" font-size="40" fill="yellow">✨</text>
                    </svg>
                `;

        burst.innerHTML = starSvg;
        gameContainer.appendChild(burst);

        setTimeout(() => {
          if (burst.parentNode) {
            burst.parentNode.removeChild(burst);
          }
        }, 500);
      }

      function startGame() {
        score = 0;
        timeLeft = 30;
        gameActive = true;

        scoreElement.textContent = score;
        timerElement.textContent = timeLeft;

        startScreen.classList.add("hidden");
        gameOverScreen.classList.add("hidden");

        // Create balloons at random intervals
        balloonInterval = setInterval(() => {
          createBalloon();
        }, 800);

        // Start timer
        timerInterval = setInterval(() => {
          timeLeft -= 1;
          timerElement.textContent = timeLeft;

          if (timeLeft <= 0) {
            endGame();
          }
        }, 1000);
      }

      function endGame() {
        gameActive = false;
        clearInterval(balloonInterval);
        clearInterval(timerInterval);

        // Remove all balloons
        balloons.forEach((balloon) => {
          clearInterval(balloon.interval);
          if (balloon.element.parentNode) {
            balloon.element.parentNode.removeChild(balloon.element);
          }
        });
        balloons = [];

        // Show game over screen
        finalScoreElement.textContent = score;
        gameOverScreen.classList.remove("hidden");
      }

      // Event listeners
      startBtn.addEventListener("click", startGame);
      playAgainBtn.addEventListener("click", startGame);

      // Prevent scrolling on touch devices
      document.body.addEventListener(
        "touchmove",
        (e) => {
          if (gameActive) {
            e.preventDefault();
          }
        },
        { passive: false }
      );
    });
  </script>

  <!-- KidsGames PWA Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/KidsGames/sw.js")
          .then((registration) => {
            console.log("[PWA] Service Worker registered for premium game");
          })
          .catch((error) => {
            console.log("[PWA] Service Worker registration failed:", error);
          });
      });
    }
  </script>
