<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spider IK</title>
<meta name="description" content="Guide a little spider through 21 caves. Collect the orbs, dodge the hazards and reach the portal.">
<meta name="theme-color" content="#0c1b1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/KidsGames/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/KidsGames/icons/icon-32x32.png">
<link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png">
<style>html,body{margin:0;height:100%;background:#0c1b1e;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
#kit-load{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0c1b1e;--p:0}
#kit-load svg{width:min(34vw,34vh,180px);height:auto}
#kit-load .bar{stroke-dasharray:100;stroke-dashoffset:calc(100 * (1 - var(--p)))}
#kit-load .orb{animation:sp-glow 1.6s ease-in-out infinite;transform-origin:50px 50px}
@keyframes sp-glow{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1.05);opacity:1}}</style>
</head>
<body>
<!-- Spider IK on Phaser 4 (MIT, pinned in js/vendor), started only by Kit.play (js/kit/play.js).
     Matter physics for the walls, the spider and its legs (shapes traced by tools/trace.js), the original Scratch art
     (js/assets.js, levels/), recorded CC0 sounds through Kit.snd (audio/sfx, cut by tools/sound-cut.py).
     game/art.js the paint box · game/cave.js one cave · game/hud.js the interface · game/main.js Boot and start. -->
<!-- The loading picture: drawn by the page at once, before the engine downloads; an orb that glows while its ring fills
     (js/kit/load.js moves --p and takes it away when the first cave is ready). No words. -->
<div id="kit-load"><svg viewBox="0 0 100 100" aria-hidden="true">
<circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/>
<circle class="bar" cx="50" cy="50" r="40" fill="none" stroke="#8fe0bd" stroke-width="6" stroke-linecap="round" pathLength="100" transform="rotate(-90 50 50)"/>
<defs><radialGradient id="sp-g" cx=".38" cy=".38" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#8fe0bd"/><stop offset="1" stop-color="#2f8f77"/></radialGradient></defs>
<circle class="orb" cx="50" cy="50" r="16" fill="url(#sp-g)"/>
</svg></div>
<script src="/KidsGames/js/kit/load.js"></script>
<script src="/KidsGames/js/kahf-bridge.js" defer></script>
<script src="/KidsGames/js/vendor/phaser-4.2.1.min.js" defer></script>
<script src="/KidsGames/js/kit/core.js" defer></script>
<script src="/KidsGames/js/kit/sound.js" defer></script>
<script src="/KidsGames/js/kit/play.js" defer></script>
<script src="js/assets.js" defer></script>
<script src="game/art.js" defer></script>
<script src="game/cave.js" defer></script>
<script src="game/hud.js" defer></script>
<script src="game/main.js" defer></script>
</body>
</html>
