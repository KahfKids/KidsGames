<!DOCTYPE html>
<!--
  2048 Garden (Kahf Kids edition).
  Based on 2048 by Gabriele Cirulli (https://github.com/gabrielecirulli/2048), MIT licence: see LICENSE.txt.
  The merge rules (js/game_manager.js, js/grid.js, js/tile.js) come from that game, adapted here.
  Garden art, levels, sounds and everything else are new, built on the Kahf KidsGames kit.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>2048 Garden</title>
  <meta name="description" content="Swipe the glazed garden tiles, join two the same and reach each goal tile, from 8 on a small tray to 256." />
  <meta name="theme-color" content="#7cc6ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/KidsGames/manifest.json" />
  <link rel="icon" href="/KidsGames/icons/icon-192x192.png" />
  <link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png" />
  <link rel="stylesheet" href="/KidsGames/js/kit/kit.css" />
  <style>
    #g48-undo { position: relative; }
    #g48-undo.g48-off { opacity: 0.45; }
    #g48-undo.g48-shake { animation: g48-shake 0.35s; }
    .g48-badge { position: absolute; top: -5px; right: -5px; min-width: 21px; height: 21px; padding: 0 5px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center; font: 800 13px/1 Nunito, system-ui, sans-serif;
      color: #2a1606; background: linear-gradient(180deg, #ffd978, #f6c453); border: 2px solid rgba(20, 12, 40, 0.65); }
    @keyframes g48-shake { 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
  </style>
  <script src="/KidsGames/js/kahf-bridge.js" defer></script>
</head>
<body>
  <canvas id="stage" class="kit-stage" aria-label="2048 Garden game"></canvas>

  <script src="/KidsGames/js/kit/core.js"></script>
  <script src="/KidsGames/js/kit/fx.js"></script>
  <script src="/KidsGames/js/kit/audio.js"></script>
  <script src="/KidsGames/js/kit/ui.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/art.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>

  <script>
    if ("serviceWorker" in navigator && location.pathname.indexOf("/KidsGames/") === 0 && !/[?&](debug|nosw)\b/.test(location.search)) {
      addEventListener("load", function () { navigator.serviceWorker.register("/KidsGames/sw.js").catch(function () {}); });
    }
  </script>
</body>
</html>
