<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Follow the Light</title>
<meta name="description" content="Watch the lanterns glow, then tap them in the same order. A memory game with 30 levels.">
<meta name="theme-color" content="#0b0820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/KidsGames/manifest.json">
<link rel="icon" href="/KidsGames/icons/icon-192x192.png">
<link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png">
<style>html,body{margin:0;height:100%;background:#0b0820;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
#kit-load{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0b0820;--p:0}
#kit-load svg{width:min(34vw,34vh,180px);height:auto}
#kit-load .bar{stroke-dasharray:100;stroke-dashoffset:calc(100 * (1 - var(--p)))}
#kit-load .glow{animation:fl-glow 1.6s ease-in-out infinite;transform-origin:50px 50px}
@keyframes fl-glow{0%,100%{transform:scale(.92);opacity:.8}50%{transform:scale(1.06);opacity:1}}</style>
</head>
<body>
<!-- Follow the Light on Phaser 4 (MIT, pinned in js/vendor), started only by Kit.play (js/kit/play.js).
     game/levels.js the 30 levels · game/common.js shared state · game/art.js the paint box · game/play.js the world and the rules · game/hud.js the
     interface · game/main.js Boot and start. Recorded CC0 sounds through Kit.snd (audio/sfx, cut by tools/sound-cut.py). -->
<!-- The loading picture: drawn by the page at once, before the engine downloads; a lantern's glow that breathes while a
     ring fills (js/kit/load.js moves --p and takes it away when the first view is ready). No words. -->
<div id="kit-load"><svg viewBox="0 0 100 100" aria-hidden="true">
<circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/>
<circle class="bar" cx="50" cy="50" r="40" fill="none" stroke="#ffd36b" stroke-width="6" stroke-linecap="round" pathLength="100" transform="rotate(-90 50 50)"/>
<defs><radialGradient id="fl-g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe8"/><stop offset=".45" stop-color="#ffc23a"/><stop offset="1" stop-color="#ffc23a" stop-opacity="0"/></radialGradient></defs>
<circle class="glow" cx="50" cy="50" r="26" fill="url(#fl-g)"/>
</svg></div>
<script src="/KidsGames/js/kit/load.js"></script>
<script src="/KidsGames/js/kahf-bridge.js" defer></script>
<script src="/KidsGames/js/vendor/phaser-4.2.1.min.js" defer></script>
<script src="/KidsGames/js/kit/core.js" defer></script>
<script src="/KidsGames/js/kit/sound.js" defer></script>
<script src="/KidsGames/js/kit/play.js" defer></script>
<script src="game/levels.js" defer></script>
<script src="game/common.js" defer></script>
<script src="game/art.js" defer></script>
<script src="game/play.js" defer></script>
<script src="game/hud.js" defer></script>
<script src="game/main.js" defer></script>
</body>
</html>
