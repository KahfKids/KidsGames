<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f2efe7" />
  <title>Helping Home</title>
  <link rel="manifest" href="/KidsGames/manifest.json" />
  <link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png" />
  <link rel="stylesheet" href="/KidsGames/js/kit/kit.css" />
  <script src="/KidsGames/js/kahf-bridge.js" defer></script>
</head>
<body>
  <!-- Drawing engine: Colorfigures by April Zhu (MIT), see iso/LICENSE-colorfigures. Made with Colorfigures. -->
  <script src="/KidsGames/games/helping-home/iso/core.js"></script>
  <script src="/KidsGames/js/kit/core.js"></script>
  <script src="/KidsGames/js/kit/audio.js"></script>
  <script src="/KidsGames/js/kit/fx.js"></script>
  <script src="/KidsGames/js/kit/ui.js"></script>
  <script src="/KidsGames/games/helping-home/iso/kidpass.js"></script>
  <script src="/KidsGames/games/helping-home/iso/flow.js"></script>
  <!-- prayer times on the device (adhan-js, MIT). Optional: without them the house uses fixed times. -->
  <script src="/KidsGames/games/helping-home/iso/vendor/adhan.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/iso/cities.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/iso/prayer.js" onerror="void 0"></script>
  <script>
    // prayer.js needs adhan-js; if either is missing or throws, the house falls back to fixed times
    try { if (window.HHPrayer && !window.adhan) window.HHPrayer = undefined; } catch (e) {}
  </script>
  <!-- the house; the family, the days and the street are optional modules (the house works without them) -->
  <script src="/KidsGames/games/helping-home/house/kit3d.js"></script>
  <script src="/KidsGames/games/helping-home/house/draw.js"></script>
  <script src="/KidsGames/games/helping-home/house/days.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/house/family.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/house/pets.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/house/street.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/pray/chart.js" onerror="void 0"></script>
  <!-- play with the family and the place scenes (optional too) -->
  <script src="/KidsGames/games/helping-home/house/play-blocks.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/house/play-catch.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/house/play-hide.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/house/scene-kit.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/house/scene-shop.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/house/scene-park.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/house/scene-mosque.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/house/scene-neighbour.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/house/scene-cook.js" onerror="void 0"></script>
  <!-- the guide (today's strip, hints, rewards) and the sticker book build on window.HOUSE (optional) -->
  <script src="/KidsGames/games/helping-home/house/guide.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/house/book.js" onerror="void 0"></script>
  <script src="/KidsGames/games/helping-home/house/life.js"></script>
  <script src="/KidsGames/games/helping-home/house/main.js"></script>
</body>
</html>
