<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fc7d6">
<title>Helping Home</title>

<link rel="icon" type="image/png" sizes="32x32" href="/KidsGames/icons/icon-32x32.png">
<link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png">
<style>html,body{margin:0;height:100%;background:#8fc7d6;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}</style>
</head>
<body>
<!-- Helping Home, the life game. Phaser 4 (MIT, pinned in js/vendor), started only by Kit.play (js/kit/play.js).
     The simulation (life/world.js, life/rules.js) knows nothing of the engine; game.js, panels.js and guides.js are its scenes.
     Sound is Phaser's own (js/kit/sound.js): recordings in audio/sfx (cut by tools/sound-cut.py) and the voices in audio/.
     The words of wudu and salah come unchanged from pray/*-text.js (TEACHER REVIEW). -->
<!-- The loading screen: drawn by the page itself, so it shows at once while the engine and the town download (about
     2 MB on a first visit). The house's windows fill with light as the files arrive; no words. The game moves it on
     (HHLoad.to) and takes it away when the first view is ready (HHLoad.done). -->
<div id="hh-load" style="position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#8fc7d6;transition:opacity .35s">
<svg viewBox="0 0 200 200" style="width:min(42vw,42vh,220px);height:auto;animation:hh-bob 1.6s ease-in-out infinite" aria-hidden="true">
<defs><clipPath id="hh-fill"><rect id="hh-lvl" x="0" y="178" width="200" height="0"/></clipPath></defs>
<ellipse cx="100" cy="182" rx="70" ry="9" fill="#000" opacity=".12"/>
<path d="M34 92 100 34 166 92" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="52" y="86" width="96" height="88" rx="10" fill="#fff"/>
<rect x="64" y="98" width="72" height="66" rx="6" fill="#d8e6ea"/>
<rect x="64" y="98" width="72" height="66" rx="6" fill="#ffc94d" clip-path="url(#hh-fill)"/>
<path d="M100 98v66M64 131h72" stroke="#fff" stroke-width="6"/>
</svg>
</div>
<style>@keyframes hh-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}</style>
<script>
(function () {
  var el = document.getElementById('hh-load'), lvl = document.getElementById('hh-lvl'), shown = 0, want = 0, gone = false, t0 = Date.now();
  function draw() {
    if (gone) return;
    var creep = 0.3 * (1 - Math.exp(-(Date.now() - t0) / 4000));            // while the engine downloads: never still
    var v = Math.max(want, creep); shown += (v - shown) * 0.12;
    // a safety net: a cached older game.js never calls done(), so once any scene past Boot is up and nothing is
    // loading, go anyway (a loader that never leaves is worse than none)
    var g = window.Kit && Kit.play && Kit.play.game, ss = g && g.isRunning && g.scene.getScenes(true).filter(function (s) { var k = s.sys.settings.key; return k !== 'Boot' && k !== 'KitSound'; });
    if (ss && ss.length && !ss.some(function (s) { return s.load && s.load.isLoading(); }) && Date.now() - (window.HHLoad.t || 0) > 1500) { window.HHLoad.done(); return; }
    var h = 66 * shown; lvl.setAttribute('y', 164 - h); lvl.setAttribute('height', h);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  window.HHLoad = {
    t: 0,
    to: function (v) { window.HHLoad.t = Date.now(); if (v > want) want = Math.min(1, v); },
    done: function () { if (gone) return; want = 1; gone = true; lvl.setAttribute('y', 98); lvl.setAttribute('height', 66); el.style.opacity = '0'; el.style.pointerEvents = 'none'; setTimeout(function () { el.remove(); }, 400); }
  };
})();
</script>

</body>
