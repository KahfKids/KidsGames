<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f2efe7" />
  <title>Washing machine · Helping Home</title>
  <link rel="manifest" href="/KidsGames/manifest.json" />
  <link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png" />
  <link rel="stylesheet" href="/KidsGames/js/kit/kit.css" />
  <script src="/KidsGames/js/kahf-bridge.js" defer></script>
</head>
<body>
  <!-- Drawing engine: Colorfigures by April Zhu (MIT), see ../iso/LICENSE-colorfigures -->
  <script src="/KidsGames/games/helping-home/iso/core.js"></script>
  <script src="/KidsGames/js/kit/core.js"></script>
  <script src="/KidsGames/js/kit/audio.js"></script>
  <script src="/KidsGames/js/kit/praise-clips.js"></script>
  <script src="/KidsGames/js/kit/fx.js"></script>
  <script src="/KidsGames/js/kit/ui.js"></script>
  <script src="/KidsGames/games/helping-home/iso/kidpass.js"></script>
  <script src="/KidsGames/games/helping-home/iso/flow.js"></script>
  <script src="/KidsGames/games/helping-home/jobs/washer.js"></script>
  <script>
  (function () {
    var Wm = window.WASHER, st = Wm.ui.st;
    var all = function (s) { return s.items.every(function (i) { return i.where === 'basket' && i.washed; }); };
    var flying = function (s) { return s.items.some(function (i) { return i.where === 'fly'; }); };
    var running = function (s) { return s.phase === 'run'; };
    HH.mount({
      ui: Wm.ui, scene: Wm.scene, acts: Wm.acts,
      steps: [
        { id: 'door',   icon: 'door',   label: 'Door',      run: Wm.openDoor, done: function (s) { return s.doorT === 1; }, off: running },
        { id: 'load',   icon: 'load',   label: 'Clothes', run: Wm.load,    done: function (s) { return Wm.inDrum(s) === 5; }, off: running },
        { id: 'soap',   icon: 'soap',   label: 'Soap',      run: Wm.addSoap,  done: function (s) { return s.soap > .5 || running(s); }, off: running },
        // the Wash choice (Quick / Warm / Gentle) is off the bar for now: the machine stays on Warm (plan, decision 5)
        { id: 'start',  icon: 'start',  label: 'Start',     run: Wm.start,    done: function (s) { return s.phase === 'done'; } },
        { id: 'unload', icon: 'unload', label: 'Take out',  run: Wm.unload,   off: function (s) { return s.phase !== 'done' || s.lock; } },
      ],
      next: function (s) {
        if (running(s) || flying(s) || s.pour > 0) return null;
        if (s.phase === 'done') return Wm.inDrum(s) && !s.lock ? 'unload' : null;
        if (Wm.inBasket(s)) return s.doorT < 1 ? 'door' : 'load';
        if (s.soap < .5) return 'soap';
        return 'start';
      },
      key: function (s) { return [s.phase, s.lock, s.doorT, Wm.inDrum(s), Wm.inBasket(s), s.soap > .5, s.prog, flying(s), s.pour > 0].join('|'); },
      finished: function (s) { return s.phase === 'done' && all(s); },
      reset: function (s) { HH.zoom(null, 1, 0); Wm.reset(s); },
      doneTitle: 'All clean!', againLabel: 'Wash again', praise: 'mashaallah', station: 'washer',
      sound: function (ev, a) {
        var m = { doorOpen: 'latch', doorClose: 'shut', 'in': 'cloth', out: 'cloth', pour: 'pour', prog: 'detent', start: 'press', done: 'latch' }[ev];
        if (m) HH.play(m);
        if (ev === 'start'){ setTimeout(function () { HH.play('latch'); }, 180);
          setTimeout(function () { if (st.phase === 'run' && !st.xrT) HH.zoom(Wm.porthole, innerWidth <= 560 ? 2 : 1.6, 900); }, 700); }
        if (ev === 'done') HH.zoom(null, 1, 800);
        if (ev === 'stage'){ var d = a.ms / 1000, n = a.name;
          HH.play({ fill: 'fill', rfill: 'fill', wash: 'slosh', rinse: 'slosh', drain: 'drain', rdrain: 'drain', spin: 'spin', stop: 'wind' }[n], { dur: d }); }
      },
    });
  })();
  </script>
</body>
</html>
