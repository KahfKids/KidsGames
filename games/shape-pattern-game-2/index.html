<style>html,body{margin:0;height:100%;background:#24195a;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
#kit-load{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#24195a;--p:0}
#kit-load svg{width:min(34vw,34vh,180px);height:auto}
#kit-load .bar{stroke-dasharray:100;stroke-dashoffset:calc(100 * (1 - var(--p)))}
#kit-load .st{animation:sp-glow 1.6s ease-in-out infinite;transform-origin:50px 50px}
@keyframes sp-glow{0%,100%{transform:scale(.92) rotate(0);opacity:.85}50%{transform:scale(1.05) rotate(8deg);opacity:1}}</style>

<body>
<!-- Shape Patterns on Phaser 4 (MIT, pinned in js/vendor), started only by Kit.play (js/kit/play.js).
     game/levels.js the 30 levels (rules) · game/art.js the paint box (pictures painted once) · game/play.js the train and
     its pieces (drag, drop zones, tweens, tile sprites) · game/hud.js the interface · game/main.js Boot and start.
     Recorded CC0 sounds through Kit.snd (audio/sfx, cut by tools/sound-cut.py, credits in audio/CREDITS.md). -->
<!-- The loading picture: drawn by the page at once, before the engine downloads: a gold star that turns while a ring fills
     (js/kit/load.js moves --p and takes it away when the first train is ready). No words. -->
<div id="kit-load"><svg viewBox="0 0 100 100" aria-hidden="true">
<circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="6"/>
<circle class="bar" cx="50" cy="50" r="42" fill="none" stroke="#f6c453" stroke-width="6" stroke-linecap="round" pathLength="100" transform="rotate(-90 50 50)"/>
<path class="st" fill="#f5bd3c" d="M50 22 55.3 33.1 66 28.2 64.9 40.3 76.1 44.7 66 50 76.1 55.3 64.9 59.7 66 71.8 55.3 66.9 50 78 44.7 66.9 34 71.8 35.1 59.7 23.9 55.3 34 50 23.9 44.7 35.1 40.3 34 28.2 44.7 33.1Z"/>
</svg></div>
