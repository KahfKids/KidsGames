    body {
      font-family: "Comic Sans MS", cursive, sans-serif;
      background-color: #f0f9ff;
      touch-action: manipulation;
    }

    .shape {
      cursor: grab;
      transition: transform 0.2s;
      user-select: none;
    }

    .shape:active {
      cursor: grabbing;
    }

    body > .shape.dragging {
      position: fixed;
      left: 0;
      top: 0;
      margin: 0;
      z-index: 50;
      pointer-events: none;
    }

    .shape.dragging {
      opacity: 0.8;
      transform: scale(1.05);
    }

    .dropzone {
      transition: all 0.3s;
    }

    .dropzone.highlight {
      background-color: rgba(255, 255, 255, 0.5) !important;
      transform: scale(1.05);
    }

    .success-animation {
      animation: success 0.5s ease-in-out;
    }

    @keyframes success {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }

      100% {
        transform: scale(1);
      }
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      opacity: 0;
    }

    .progress-bar {
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      transition: width 0.5s;
    }

    .star {
      transition: transform 0.3s, opacity 0.3s;
    }

    .star.earned {
      transform: scale(1.2);
      opacity: 1;
    }

    .star.unearned {
      transform: scale(0.8);
      opacity: 0.3;
    }

<body>
  <div class="min-h-screen flex flex-col items-center p-4 md:p-8">
    <header class="w-full max-w-3xl text-center mb-4">
      <h1 class="text-3xl md:text-4xl font-bold text-indigo-600 mb-2">
        Shape Pattern Game
      </h1>
      <p class="text-lg text-indigo-500">
        Arrange the shapes to match the pattern!
      </p>
    </header>

    <div class="w-full max-w-3xl bg-blue-100 rounded-2xl p-4 md:p-6 shadow-lg">
      <!-- Level info and controls -->
      <div class="flex justify-between items-center mb-4">
        <div class="flex items-center">
          <span class="text-xl font-bold text-blue-700">Level: </span>
          <span id="level-display" class="text-xl font-bold text-blue-700 ml-2">1</span>
          <span class="text-xl font-bold text-blue-700 mx-1">/</span>
          <span id="total-levels" class="text-xl font-bold text-blue-700">8</span>
        </div>
        <div>
          <button id="next-level"
            class="bg-green-500 text-white px-4 py-2 rounded-full font-bold shadow-md hover:bg-green-600 transition hidden">
            Next Level
          </button>
          <button id="reset-level"
            class="bg-yellow-500 text-white px-4 py-2 rounded-full font-bold shadow-md hover:bg-yellow-600 transition">
            Reset
          </button>
        </div>
      </div>

      <!-- Progress bar -->
      <div class="mb-4">
        <div class="flex justify-between mb-1">
          <div class="flex">
            <div id="star1" class="star unearned text-2xl">⭐</div>
            <div id="star2" class="star unearned text-2xl">⭐</div>
            <div id="star3" class="star unearned text-2xl">⭐</div>
          </div>
          <div class="text-sm text-blue-700 font-bold">Progress</div>
        </div>
        <div class="progress-bar bg-blue-200">
          <div id="progress-fill" class="progress-fill bg-blue-500" style="width: 0%"></div>
        </div>
      </div>

      <!-- Pattern to match -->
      <div class="mb-6">
        <h2 class="text-xl font-bold text-blue-700 mb-2">
          Match this pattern:
        </h2>
        <div id="pattern-container" class="flex flex-wrap justify-center gap-2 p-4 bg-white rounded-xl shadow-inner">
          <svg width="60" height="60" viewBox="0 0 60 60" class="mx-1">
            <circle cx="30" cy="30" r="25" fill="#f87171" stroke="#333" stroke-width="2"></circle>
          </svg><svg width="60" height="60" viewBox="0 0 60 60" class="mx-1">
            <rect x="5" y="5" width="50" height="50" fill="#60a5fa" stroke="#333" stroke-width="2"></rect>
          </svg><svg width="60" height="60" viewBox="0 0 60 60" class="mx-1">
            <polygon points="30,5 55,55 5,55" fill="#4ade80" stroke="#333" stroke-width="2"></polygon>
          </svg>
        </div>
      </div>

      <!-- Drop zones -->
      <div class="mb-6">
        <h2 class="text-xl font-bold text-blue-700 mb-2">Your answer:</h2>
        <div id="dropzone-container"
          class="flex flex-wrap justify-center gap-2 p-4 bg-white rounded-xl shadow-inner min-h-[100px]">
          <div
            class="dropzone w-[70px] h-[70px] bg-gray-100 rounded-lg flex items-center justify-center border-2 border-dashed border-gray-300"
            data-index="0"></div>
          <div
            class="dropzone w-[70px] h-[70px] bg-gray-100 rounded-lg flex items-center justify-center border-2 border-dashed border-gray-300"
            data-index="1"></div>
          <div
            class="dropzone w-[70px] h-[70px] bg-gray-100 rounded-lg flex items-center justify-center border-2 border-dashed border-gray-300"
            data-index="2"></div>
        </div>
      </div>

      <!-- Available shapes -->
      <div>
        <h2 class="text-xl font-bold text-blue-700 mb-2">
          Available shapes:
        </h2>
        <div id="shapes-container" class="flex flex-wrap justify-center gap-3 p-4 bg-blue-200 rounded-xl">
          <div class="shape p-1 bg-white rounded-lg shadow-md" data-type="circle" data-color="red">
            <svg width="60" height="60" viewBox="0 0 60 60">
              <circle cx="30" cy="30" r="25" fill="#f87171" stroke="#333" stroke-width="2"></circle>
            </svg>
          </div>
          <div class="shape p-1 bg-white rounded-lg shadow-md" data-type="square" data-color="blue">
            <svg width="60" height="60" viewBox="0 0 60 60">
              <rect x="5" y="5" width="50" height="50" fill="#60a5fa" stroke="#333" stroke-width="2"></rect>
            </svg>
          </div>
          <div class="shape p-1 bg-white rounded-lg shadow-md" data-type="triangle" data-color="green">
            <svg width="60" height="60" viewBox="0 0 60 60">
              <polygon points="30,5 55,55 5,55" fill="#4ade80" stroke="#333" stroke-width="2"></polygon>
            </svg>
          </div>
          <div class="shape p-1 bg-white rounded-lg shadow-md" data-type="circle" data-color="yellow">
            <svg width="60" height="60" viewBox="0 0 60 60">
              <circle cx="30" cy="30" r="25" fill="#fbbf24" stroke="#333" stroke-width="2"></circle>
            </svg>
          </div>
          <div class="shape p-1 bg-white rounded-lg shadow-md" data-type="square" data-color="purple">
            <svg width="60" height="60" viewBox="0 0 60 60">
              <rect x="5" y="5" width="50" height="50" fill="#a78bfa" stroke="#333" stroke-width="2"></rect>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Success message -->
    <div id="success-message" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50 hidden">
      <div class="bg-white rounded-xl p-6 text-center shadow-2xl transform transition-all">
        <div class="text-5xl mb-4">🎉</div>
        <h2 class="text-3xl font-bold text-green-600 mb-4">Great job!</h2>
        <p class="text-xl mb-6">You completed the pattern!</p>
        <button id="continue-btn"
          class="bg-blue-600 text-white px-6 py-3 rounded-full font-bold text-lg shadow-md hover:bg-blue-700 transition">
          Continue
        </button>
      </div>
    </div>

    <!-- Game completed message -->
    <div id="game-completed" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50 hidden">
      <div class="bg-white rounded-xl p-6 text-center shadow-2xl transform transition-all">
        <div class="text-5xl mb-4">🏆</div>
        <h2 class="text-3xl font-bold text-purple-600 mb-4">
          Congratulations!
        </h2>
        <p class="text-xl mb-2">You completed all the levels!</p>
        <p id="stars-earned" class="text-lg mb-6">
          You earned <span class="font-bold">0</span> stars!
        </p>
        <button id="play-again-btn"
          class="bg-purple-600 text-white px-6 py-3 rounded-full font-bold text-lg shadow-md hover:bg-purple-700 transition">
          Play Again
        </button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const levels = [
        // Level 1: Simple pattern with 3 shapes
        {
          pattern: ["circle-red", "square-blue", "triangle-green"],
          available: [
            "circle-red",
            "square-blue",
            "triangle-green",
            "circle-yellow",
            "square-purple",
          ],
        },
        // Level 2: 4 shapes
        {
          pattern: [
            "square-blue",
            "circle-yellow",
            "triangle-green",
            "circle-red",
          ],
          available: [
            "square-blue",
            "circle-yellow",
            "triangle-green",
            "circle-red",
            "square-purple",
            "triangle-orange",
          ],
        },
        // Level 3: 5 shapes with repeats
        {
          pattern: [
            "circle-red",
            "square-blue",
            "circle-red",
            "triangle-green",
            "square-blue",
          ],
          available: [
            "circle-red",
            "square-blue",
            "triangle-green",
            "circle-yellow",
            "square-purple",
            "triangle-orange",
            "circle-red",
            "square-blue",
          ],
        },
        // Level 4: Introducing diamond shape
        {
          pattern: [
            "diamond-purple",
            "circle-yellow",
            "diamond-purple",
            "square-blue",
          ],
          available: [
            "diamond-purple",
            "circle-yellow",
            "square-blue",
            "triangle-green",
            "diamond-red",
            "circle-blue",
          ],
        },
        // Level 5: Introducing star shape
        {
          pattern: [
            "star-yellow",
            "circle-red",
            "square-blue",
            "star-yellow",
            "triangle-green",
          ],
          available: [
            "star-yellow",
            "circle-red",
            "square-blue",
            "triangle-green",
            "diamond-purple",
            "star-blue",
          ],
        },
        // Level 6: Introducing heart shape
        {
          pattern: [
            "heart-red",
            "star-yellow",
            "heart-red",
            "circle-blue",
            "square-green",
          ],
          available: [
            "heart-red",
            "star-yellow",
            "circle-blue",
            "square-green",
            "triangle-orange",
            "diamond-purple",
          ],
        },
        // Level 7: Introducing hexagon shape
        {
          pattern: [
            "hexagon-blue",
            "circle-yellow",
            "triangle-green",
            "hexagon-blue",
            "heart-red",
            "star-purple",
          ],
          available: [
            "hexagon-blue",
            "circle-yellow",
            "triangle-green",
            "heart-red",
            "star-purple",
            "square-orange",
            "diamond-blue",
          ],
        },
        // Level 8: Complex pattern with all shapes
        {
          pattern: [
            "star-yellow",
            "hexagon-blue",
            "heart-red",
            "diamond-purple",
            "circle-green",
            "square-orange",
            "triangle-blue",
          ],
          available: [
            "star-yellow",
            "hexagon-blue",
            "heart-red",
            "diamond-purple",
            "circle-green",
            "square-orange",
            "triangle-blue",
            "star-red",
            "hexagon-green",
            "heart-purple",
          ],
        },
      ];

      let currentLevel = 0;
      let draggingElement = null;
      let touchOffset = { x: 0, y: 0 };
      let totalStars = 0;
      let attempts = 0;

      const shapeColors = {
        red: "#f87171",
        blue: "#60a5fa",
        green: "#4ade80",
        yellow: "#fbbf24",
        purple: "#a78bfa",
        orange: "#fb923c",
        pink: "#f472b6",
        teal: "#2dd4bf",
      };

      const nextLevelBtn = document.getElementById("next-level");
      const resetLevelBtn = document.getElementById("reset-level");
      const successMessage = document.getElementById("success-message");
      const gameCompleted = document.getElementById("game-completed");
      const continueBtn = document.getElementById("continue-btn");
      const playAgainBtn = document.getElementById("play-again-btn");
      const levelDisplay = document.getElementById("level-display");
      const totalLevelsDisplay = document.getElementById("total-levels");
      const progressFill = document.getElementById("progress-fill");
      const starsEarned = document
        .getElementById("stars-earned")
        .querySelector("span");
      const star1 = document.getElementById("star1");
      const star2 = document.getElementById("star2");
      const star3 = document.getElementById("star3");

      totalLevelsDisplay.textContent = levels.length;

      function createSVGShape(type, color) {
        const size = 60;
        const svg = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg"
        );
        svg.setAttribute("width", size);
        svg.setAttribute("height", size);
        svg.setAttribute("viewBox", "0 0 60 60");

        let shape;
        if (type === "circle") {
          shape = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
          );
          shape.setAttribute("cx", "30");
          shape.setAttribute("cy", "30");
          shape.setAttribute("r", "25");
        } else if (type === "square") {
          shape = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "rect"
          );
          shape.setAttribute("x", "5");
          shape.setAttribute("y", "5");
          shape.setAttribute("width", "50");
          shape.setAttribute("height", "50");
        } else if (type === "triangle") {
          shape = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polygon"
          );
          shape.setAttribute("points", "30,5 55,55 5,55");
        } else if (type === "diamond") {
          shape = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polygon"
          );
          shape.setAttribute("points", "30,5 55,30 30,55 5,30");
        } else if (type === "star") {
          shape = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polygon"
          );
          const points = calculateStarPoints(30, 30, 25, 10, 5);
          shape.setAttribute("points", points);
        } else if (type === "heart") {
          shape = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
          );
          shape.setAttribute(
            "d",
            "M30,55 C30,55 5,40 5,25 C5,15 15,5 25,15 C27,17 29,20 30,25 C31,20 33,17 35,15 C45,5 55,15 55,25 C55,40 30,55 30,55 Z"
          );
        } else if (type === "hexagon") {
          shape = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polygon"
          );
          shape.setAttribute("points", "30,5 55,18 55,42 30,55 5,42 5,18");
        }

        shape.setAttribute("fill", shapeColors[color]);
        shape.setAttribute("stroke", "#333");
        shape.setAttribute("stroke-width", "2");
        svg.appendChild(shape);

        return svg;
      }

      function calculateStarPoints(
        centerX,
        centerY,
        outerRadius,
        innerRadius,
        points
      ) {
        let angleIncrement = Math.PI / points;
        let result = "";

        for (let i = 0; i < points * 2; i++) {
          let radius = i % 2 === 0 ? outerRadius : innerRadius;
          let angle = i * angleIncrement;
          let x = centerX + radius * Math.sin(angle);
          let y = centerY - radius * Math.cos(angle);
          result += `${x},${y} `;
        }

        return result.trim();
      }

      function setupLevel(levelIndex) {
        currentLevel = levelIndex;
        levelDisplay.textContent = levelIndex + 1;
        attempts = 0;

        // Update progress bar
        const progress = (levelIndex / levels.length) * 100;
        progressFill.style.width = `${progress}%`;

        // Reset stars for this level
        star1.classList.replace("earned", "unearned");
        star2.classList.replace("earned", "unearned");
        star3.classList.replace("earned", "unearned");

        const level = levels[levelIndex];
        const patternContainer = document.getElementById("pattern-container");
        const dropzoneContainer =
          document.getElementById("dropzone-container");
        const shapesContainer = document.getElementById("shapes-container");

        // Clear containers
        patternContainer.innerHTML = "";
        dropzoneContainer.innerHTML = "";
        shapesContainer.innerHTML = "";

        // Create pattern
        level.pattern.forEach((shapeInfo) => {
          const [type, color] = shapeInfo.split("-");
          const shapeElement = createSVGShape(type, color);
          shapeElement.classList.add("mx-1");
          patternContainer.appendChild(shapeElement);
        });

        // Create dropzones
        level.pattern.forEach((_, index) => {
          const dropzone = document.createElement("div");
          dropzone.classList.add(
            "dropzone",
            "w-[70px]",
            "h-[70px]",
            "bg-gray-100",
            "rounded-lg",
            "flex",
            "items-center",
            "justify-center",
            "border-2",
            "border-dashed",
            "border-gray-300"
          );
          dropzone.dataset.index = index;
          dropzoneContainer.appendChild(dropzone);
        });

        // Create available shapes
        level.available.forEach((shapeInfo, index) => {
          const [type, color] = shapeInfo.split("-");
          const shapeWrapper = document.createElement("div");
          shapeWrapper.classList.add(
            "shape",
            "p-1",
            "bg-white",
            "rounded-lg",
            "shadow-md"
          );
          shapeWrapper.dataset.type = type;
          shapeWrapper.dataset.color = color;

          const shapeElement = createSVGShape(type, color);
          shapeWrapper.appendChild(shapeElement);
          shapesContainer.appendChild(shapeWrapper);

          // Setup drag events
          setupDragEvents(shapeWrapper);
        });

        nextLevelBtn.classList.add("hidden");
      }

      function setupDragEvents(element) {
        // Mouse events
        element.addEventListener("mousedown", startDrag);

        // Touch events
        element.addEventListener("touchstart", startDragTouch, {
          passive: false,
        });

        function startDrag(e) {
          e.preventDefault();

          // Create a clone of the element to drag
          const clone = element.cloneNode(true);
          clone.classList.add("dragging", "absolute", "z-50");
          document.body.appendChild(clone);

          const rect = element.getBoundingClientRect();
          const offsetX = e.clientX - rect.left;
          const offsetY = e.clientY - rect.top;

          clone.style.width = `${rect.width}px`;
          clone.style.height = `${rect.height}px`;

          function moveElement(e) {
            const x = e.clientX - offsetX;
            const y = e.clientY - offsetY;
            clone.style.left = `${x}px`;
            clone.style.top = `${y}px`;

            // Highlight dropzone under pointer
            const dropzones = document.querySelectorAll(".dropzone");
            dropzones.forEach((dropzone) => {
              const dzRect = dropzone.getBoundingClientRect();
              if (
                e.clientX >= dzRect.left &&
                e.clientX <= dzRect.right &&
                e.clientY >= dzRect.top &&
                e.clientY <= dzRect.bottom
              ) {
                dropzone.classList.add("highlight");
              } else {
                dropzone.classList.remove("highlight");
              }
            });
          }

          function endDrag(e) {
            document.removeEventListener("mousemove", moveElement);
            document.removeEventListener("mouseup", endDrag);

            // Find dropzone under pointer
            const dropzones = document.querySelectorAll(".dropzone");
            let dropped = false;

            dropzones.forEach((dropzone) => {
              dropzone.classList.remove("highlight");
              const dzRect = dropzone.getBoundingClientRect();

              if (
                e.clientX >= dzRect.left &&
                e.clientX <= dzRect.right &&
                e.clientY >= dzRect.top &&
                e.clientY <= dzRect.bottom
              ) {
                // Remove existing shape in dropzone if any
                while (dropzone.firstChild) {
                  dropzone.removeChild(dropzone.firstChild);
                }

                // Create a new shape in the dropzone
                const newShape = document.createElement("div");
                newShape.classList.add("shape-in-dropzone");
                newShape.dataset.type = element.dataset.type;
                newShape.dataset.color = element.dataset.color;

                const shapeElement = createSVGShape(
                  element.dataset.type,
                  element.dataset.color
                );
                newShape.appendChild(shapeElement);
                dropzone.appendChild(newShape);

                dropped = true;
                attempts++;

                // Check if pattern is complete
                checkPattern();
              }
            });

            // Remove the clone
            document.body.removeChild(clone);
          }

          document.addEventListener("mousemove", moveElement);
          document.addEventListener("mouseup", endDrag);

          // Position the clone initially
          moveElement(e);
        }

        function startDragTouch(e) {
          e.preventDefault();

          // Create a clone of the element to drag
          const clone = element.cloneNode(true);
          clone.classList.add("dragging", "absolute", "z-50");
          document.body.appendChild(clone);

          const touch = e.touches[0];
          const rect = element.getBoundingClientRect();
          touchOffset.x = touch.clientX - rect.left;
          touchOffset.y = touch.clientY - rect.top;

          clone.style.width = `${rect.width}px`;
          clone.style.height = `${rect.height}px`;

          function moveElementTouch(e) {
            if (e.cancelable) e.preventDefault();
            const touch = e.touches[0];
            const x = touch.clientX - touchOffset.x;
            const y = touch.clientY - touchOffset.y;
            clone.style.left = `${x}px`;
            clone.style.top = `${y}px`;

            // Highlight dropzone under pointer
            const dropzones = document.querySelectorAll(".dropzone");
            dropzones.forEach((dropzone) => {
              const dzRect = dropzone.getBoundingClientRect();
              if (
                touch.clientX >= dzRect.left &&
                touch.clientX <= dzRect.right &&
                touch.clientY >= dzRect.top &&
                touch.clientY <= dzRect.bottom
              ) {
                dropzone.classList.add("highlight");
              } else {
                dropzone.classList.remove("highlight");
              }
            });
          }

          function endDragTouch(e) {
            document.removeEventListener("touchmove", moveElementTouch);
            document.removeEventListener("touchend", endDragTouch);

            // Find dropzone under pointer
            const dropzones = document.querySelectorAll(".dropzone");
            let dropped = false;

            if (e.changedTouches.length > 0) {
              const touch = e.changedTouches[0];

              dropzones.forEach((dropzone) => {
                dropzone.classList.remove("highlight");
                const dzRect = dropzone.getBoundingClientRect();

                if (
                  touch.clientX >= dzRect.left &&
                  touch.clientX <= dzRect.right &&
                  touch.clientY >= dzRect.top &&
                  touch.clientY <= dzRect.bottom
                ) {
                  // Remove existing shape in dropzone if any
                  while (dropzone.firstChild) {
                    dropzone.removeChild(dropzone.firstChild);
                  }

                  // Create a new shape in the dropzone
                  const newShape = document.createElement("div");
                  newShape.classList.add("shape-in-dropzone");
                  newShape.dataset.type = element.dataset.type;
                  newShape.dataset.color = element.dataset.color;

                  const shapeElement = createSVGShape(
                    element.dataset.type,
                    element.dataset.color
                  );
                  newShape.appendChild(shapeElement);
                  dropzone.appendChild(newShape);

                  dropped = true;
                  attempts++;

                  // Check if pattern is complete
                  checkPattern();
                }
              });
            }

            // Remove the clone
            document.body.removeChild(clone);
          }

          document.addEventListener("touchmove", moveElementTouch, {
            passive: false,
          });
          document.addEventListener("touchend", endDragTouch);

          // Position the clone initially
          moveElementTouch(e);
        }
      }

      function checkPattern() {
        const level = levels[currentLevel];
        const dropzones = document.querySelectorAll(".dropzone");
        let correct = true;
        let filledDropzones = 0;

        dropzones.forEach((dropzone, index) => {
          const shapeInDropzone =
            dropzone.querySelector(".shape-in-dropzone");
          if (!shapeInDropzone) {
            correct = false;
            return;
          }

          filledDropzones++;

          const [expectedType, expectedColor] =
            level.pattern[index].split("-");
          const actualType = shapeInDropzone.dataset.type;
          const actualColor = shapeInDropzone.dataset.color;

          if (expectedType !== actualType || expectedColor !== actualColor) {
            correct = false;
          }
        });

        // Only check if all dropzones are filled
        if (filledDropzones === dropzones.length && correct) {
          // Calculate stars based on attempts
          let starsForLevel = 0;
          const minAttempts = level.pattern.length; // Perfect score

          if (attempts <= minAttempts) {
            starsForLevel = 3;
            star1.classList.replace("unearned", "earned");
            star2.classList.replace("unearned", "earned");
            star3.classList.replace("unearned", "earned");
          } else if (attempts <= minAttempts + 2) {
            starsForLevel = 2;
            star1.classList.replace("unearned", "earned");
            star2.classList.replace("unearned", "earned");
          } else {
            starsForLevel = 1;
            star1.classList.replace("unearned", "earned");
          }

          totalStars += starsForLevel;

          // Show success animation
          dropzones.forEach((dropzone) => {
            dropzone.classList.add("success-animation");
          });

          // Show confetti
          createConfetti();

          // Show success message after a short delay
          setTimeout(() => {
            successMessage.classList.remove("hidden");
          }, 1000);

          // Show next level button if there are more levels
          if (currentLevel < levels.length - 1) {
            nextLevelBtn.classList.remove("hidden");
          }
        }
      }

      function createConfetti() {
        const colors = [
          "#f87171",
          "#60a5fa",
          "#4ade80",
          "#fbbf24",
          "#a78bfa",
          "#fb923c",
        ];
        const confettiCount = 100;

        for (let i = 0; i < confettiCount; i++) {
          const confetti = document.createElement("div");
          confetti.classList.add("confetti");
          confetti.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];
          confetti.style.left = `${Math.random() * 100}vw`;
          confetti.style.top = "-10px";
          confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
          document.body.appendChild(confetti);

          // Animate confetti
          const duration = 1 + Math.random() * 2;
          const delay = Math.random();

          confetti.animate(
            [
              { top: "-10px", opacity: 1 },
              { top: "100vh", opacity: 0 },
            ],
            {
              duration: duration * 1000,
              delay: delay * 1000,
              easing: "cubic-bezier(0.1, 0.8, 0.9, 1)",
            }
          ).onfinish = () => {
            document.body.removeChild(confetti);
          };
        }
      }

      // Event listeners
      nextLevelBtn.addEventListener("click", () => {
        setupLevel(currentLevel + 1);
        successMessage.classList.add("hidden");
      });

      resetLevelBtn.addEventListener("click", () => {
        setupLevel(currentLevel);
      });

      continueBtn.addEventListener("click", () => {
        successMessage.classList.add("hidden");
        if (currentLevel < levels.length - 1) {
          setupLevel(currentLevel + 1);
        } else {
          // Game completed
          starsEarned.textContent = totalStars;
          gameCompleted.classList.remove("hidden");
        }
      });

      playAgainBtn.addEventListener("click", () => {
        gameCompleted.classList.add("hidden");
        totalStars = 0;
        setupLevel(0); // Restart from level 1
      });

      // Start the game
      setupLevel(0);
    });
  </script>
