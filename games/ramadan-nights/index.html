<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Ramadan Nights</title>
  <meta name="description" content="Light thirty lanterns, one for each night of Ramadan, by answering questions from the Quran and the Sunnah." />
  <meta name="theme-color" content="#14103a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/KidsGames/manifest.json" />
  <link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png" />
  <link rel="stylesheet" href="/KidsGames/js/kit/kit.css" />
  <link rel="stylesheet" href="/KidsGames/js/quiz/quiz.css" />
  <style>
    :root { --qz-bg-top: #14103a; --qz-bg-bot: #33206a; --qz-accent: #f6c453; --qz-accent-2: #e9973a; }
  </style>
  <script src="/KidsGames/js/kahf-bridge.js" defer></script>
</head>
<body>
  <script src="/KidsGames/js/kit/core.js"></script>
  <script src="/KidsGames/js/kit/fx.js"></script>
  <script src="/KidsGames/js/kit/audio.js"></script>
  <script src="/KidsGames/js/kit/ui.js"></script>
  <script src="/KidsGames/js/quiz/quiz.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/art.js"></script>
  <script src="js/data.js"></script>
  <script>
    KahfQuiz.start({
      id: 'ramadan-nights',
      title: { en: 'Ramadan Nights', bn: 'রমজানের রাত' },
      stopName: { en: 'Night', bn: 'রাত' },
      stops: 30,
      bossEvery: 10,
      bank: RamadanBank,
      pics: RamadanArt.pics,
      map: { sky: RamadanArt.sky, decor: RamadanArt.decor, stopPic: RamadanArt.stopPic },
      doneText: function (done, total) {
        return { en: done + ' of ' + total + ' lanterns lit', bn: total + 'টির মধ্যে ' + done + 'টি লণ্ঠন জ্বলেছে' };
      }
    });
    if ("serviceWorker" in navigator && location.pathname.indexOf("/KidsGames/") === 0 && !/[?&](debug|nosw)\b/.test(location.search)) {
      addEventListener("load", function () { navigator.serviceWorker.register("/KidsGames/sw.js").catch(function () {}); });
    }
  </script>
</body>
</html>
