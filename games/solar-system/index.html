<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Solar System</title>
<meta name="description" content="Fly around the Sun and the planets, then find the planets in 15 levels.">
<meta name="theme-color" content="#060718">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/KidsGames/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/KidsGames/icons/icon-32x32.png">
<link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png">
<style>html,body{margin:0;height:100%;background:#060718;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
#kit-load{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#060718;--p:0}
#kit-load svg{width:min(34vw,34vh,180px);height:auto}
#kit-load .bar{stroke-dasharray:100;stroke-dashoffset:calc(100 * (1 - var(--p)))}
#kit-load .sun{animation:ss-glow 1.8s ease-in-out infinite;transform-origin:50px 50px}
@keyframes ss-glow{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1.06);opacity:1}}</style>
</head>
<body>
<!-- Solar System on Phaser 4 (MIT, pinned in js/vendor), started only by Kit.play (js/kit/play.js).
     The planets are the engine's Shader objects lit by the Sun (game/planet.js) with surfaces made once by tools/bake.js
     (art/); orbits, belt and sky are the engine's graphics, container and tile sprites; recorded CC0 sounds through
     Kit.snd (audio/sfx, cut by tools/sound-cut.py).
     game/art.js the paint box · planet.js a lit ball · sky.js the sky · space.js the planets and the rounds ·
     hud.js the interface · main.js Boot and start. -->
<!-- The loading picture: drawn by the page at once, before the engine downloads; a sun that glows while a ring of orbit
     fills (js/kit/load.js moves --p and takes it away when the first view is ready). No words. -->
<div id="kit-load"><svg viewBox="0 0 100 100" aria-hidden="true">
<circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/>
<circle class="bar" cx="50" cy="50" r="40" fill="none" stroke="#f6c453" stroke-width="5" stroke-linecap="round" pathLength="100" transform="rotate(-90 50 50)"/>
<defs><radialGradient id="ss-g" cx=".38" cy=".38" r=".7"><stop offset="0" stop-color="#fff6d0"/><stop offset=".5" stop-color="#ffbe4d"/><stop offset="1" stop-color="#ff8a2a"/></radialGradient></defs>
<circle class="sun" cx="50" cy="50" r="15" fill="url(#ss-g)"/>
</svg></div>
<script src="/KidsGames/js/kit/load.js"></script>
<script src="/KidsGames/js/kahf-bridge.js" defer></script>
<script src="/KidsGames/js/vendor/phaser-4.2.1.min.js" defer></script>
<script src="/KidsGames/js/kit/core.js" defer></script>
<script src="/KidsGames/js/kit/sound.js" defer></script>
<script src="/KidsGames/js/kit/play.js" defer></script>
<script src="game/bodies.js" defer></script>
<script src="game/levels.js" defer></script>
<script src="game/common.js" defer></script>
<script src="game/art.js" defer></script>
<script src="game/planet.js" defer></script>
<script src="game/sky.js" defer></script>
<script src="game/space.js" defer></script>
<script src="game/hud.js" defer></script>
<script src="game/main.js" defer></script>
</body>
</html>
