<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ramadan Quest - রমাদান কোয়েস্ট</title>
    <link rel="manifest" href="/KidsGames/manifest.json">
    <meta name="theme-color" content="#1a5f2a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Bengali', sans-serif;
            background: linear-gradient(135deg, #1a5f2a 0%, #0d3d18 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .lang-btn, .settings-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .lang-btn.active {
            background: #ffc107;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .game-title {
            text-align: center;
            padding: 30px 0;
        }

        .game-title h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .game-title .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .moon-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
        }

        .start-screen, .quiz-screen, .result-screen {
            text-align: center;
        }

        .start-btn, .next-btn, .restart-btn, .share-btn {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            border: none;
            color: #333;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
            transition: transform 0.2s;
        }

        .start-btn:hover, .next-btn:hover, .restart-btn:hover {
            transform: scale(1.05);
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #ffc107, #ff9800);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .question-counter {
            font-size: 1.1em;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .score-display {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }

        .question-text {
            font-size: 1.3em;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 1.1em;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #ffc107;
        }

        .option-btn.selected {
            background: rgba(255, 193, 7, 0.3);
            border-color: #ffc107;
        }

        .option-btn.correct {
            background: rgba(76, 175, 80, 0.5);
            border-color: #4caf50;
        }

        .option-btn.wrong {
            background: rgba(244, 67, 54, 0.5);
            border-color: #f44336;
        }

        .result-screen h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 3em;
            font-weight: bold;
            color: #ffc107;
            margin: 20px 0;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffc107;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .hidden {
            display: none !important;
        }

        .settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .settings-content {
            background: linear-gradient(135deg, #2d7d3e 0%, #1a5f2a 100%);
            padding: 30px;
            border-radius: 20px;
            max-width: 350px;
            width: 90%;
            text-align: center;
        }

        .settings-content h3 {
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .setting-group {
            margin: 15px 0;
            text-align: left;
        }

        .setting-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .setting-group select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .close-settings {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 30px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }

        .points-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 193, 7, 0.95);
            color: #333;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 1.5em;
            font-weight: bold;
            z-index: 1000;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); }
            80% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .high-score {
            background: rgba(255, 193, 7, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            margin: 15px 0;
            display: inline-block;
        }

        @media (max-width: 480px) {
            .game-title h1 {
                font-size: 1.8em;
            }

            .question-text {
                font-size: 1.1em;
            }

            .option-btn {
                padding: 12px 15px;
                font-size: 1em;
            }
        }
    </style>
  <script src="/KidsGames/js/kahf-bridge.js" defer></script>
</head>
<body>
    <div class="header">
        <div class="header-spacer"></div>
        <div class="header-actions">
            <button class="lang-btn" onclick="toggleLanguage()">BN</button>
            <button class="settings-btn" onclick="openSettings()">⚙️</button>
        </div>
    </div>

    <div class="container">
        <!-- Start Screen -->
        <div class="start-screen" id="startScreen">
            <div class="game-title">
                <span class="moon-icon">🌙</span>
                <h1 data-i18n="title">Ramadan Quest</h1>
                <p class="subtitle" data-i18n="subtitle">Islamic Knowledge Quiz</p>
            </div>

            <div class="high-score" id="highScoreDisplay">
                <span data-i18n="highScore">High Score:</span> <span id="highScoreValue">0</span>
            </div>

            <button class="start-btn" onclick="startQuiz()" data-i18n="startQuiz">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div class="quiz-screen hidden" id="quizScreen">
            <div class="score-display">
                <span data-i18n="score">Score:</span> <span id="currentScore">0</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

            <div class="question-counter">
                <span data-i18n="question">Question</span> <span id="questionNum">1</span>/<span id="totalQuestions">10</span>
            </div>

            <div class="question-card">
                <div class="question-text" id="questionText"></div>
                <div class="options-container" id="optionsContainer"></div>
            </div>

            <button class="next-btn hidden" id="nextBtn" onclick="nextQuestion()" data-i18n="next">Next Question</button>
        </div>

        <!-- Result Screen -->
        <div class="result-screen hidden" id="resultScreen">
            <h2 data-i18n="quizComplete">Quiz Complete!</h2>
            <div class="final-score" id="finalScore">0</div>
            <p data-i18n="points">points</p>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label" data-i18n="correct">Correct</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="wrongCount">0</div>
                    <div class="stat-label" data-i18n="wrong">Wrong</div>
                </div>
            </div>

            <div class="high-score" id="newHighScore" style="display: none;">
                <span>🎉</span> <span data-i18n="newHighScore">New High Score!</span>
            </div>

            <button class="restart-btn" onclick="restartQuiz()" data-i18n="playAgain">Play Again</button>
            <button class="share-btn" onclick="shareScore()" data-i18n="share">Share Score</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-modal hidden" id="settingsModal">
        <div class="settings-content">
            <h3 data-i18n="settings">Settings</h3>

            <div class="setting-group">
                <label data-i18n="questionCount">Number of Questions:</label>
                <select id="questionCountSelect">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                </select>
            </div>

            <button class="close-settings" onclick="closeSettings()" data-i18n="close">Close</button>
        </div>
    </div>

    <script>
        // Translations
        const translations = {
            en: {
                title: "Ramadan Quest",
                subtitle: "Islamic Knowledge Quiz",
                back: "Back",
                highScore: "High Score:",
                startQuiz: "Start Quiz",
                score: "Score:",
                question: "Question",
                next: "Next Question",
                quizComplete: "Quiz Complete!",
                points: "points",
                correct: "Correct",
                wrong: "Wrong",
                newHighScore: "New High Score!",
                playAgain: "Play Again",
                share: "Share Score",
                settings: "Settings",
                questionCount: "Number of Questions:",
                close: "Close",
                shareText: "I scored {score} points in Ramadan Quest quiz! Can you beat my score?",
                finish: "Finish"
            },
            bn: {
                title: "রমাদান কোয়েস্ট",
                subtitle: "ইসলামিক জ্ঞান কুইজ",
                back: "পিছনে",
                highScore: "সর্বোচ্চ স্কোর:",
                startQuiz: "কুইজ শুরু করুন",
                score: "স্কোর:",
                question: "প্রশ্ন",
                next: "পরবর্তী প্রশ্ন",
                quizComplete: "কুইজ সম্পন্ন!",
                points: "পয়েন্ট",
                correct: "সঠিক",
                wrong: "ভুল",
                newHighScore: "নতুন সর্বোচ্চ স্কোর!",
                playAgain: "আবার খেলুন",
                share: "শেয়ার করুন",
                settings: "সেটিংস",
                questionCount: "প্রশ্নের সংখ্যা:",
                close: "বন্ধ করুন",
                shareText: "আমি রমাদান কোয়েস্ট কুইজে {score} পয়েন্ট পেয়েছি! আপনি কি আমার স্কোর কে হারাতে পারবেন?",
                finish: "সমাপ্ত"
            }
        };

        // Questions database with translations
        const questions = [
            // Ramadan & Fasting (1-30)
            {
                question: { en: "What is the ninth month of the Islamic calendar called?", bn: "ইসলামি ক্যালেন্ডারের নবম মাসের নাম কী?" },
                options: {
                    en: ["Ramadan", "Shaban", "Shawwal", "Muharram"],
                    bn: ["রমজান", "শাবান", "শাওয়াল", "মুহররম"]
                },
                answer: { en: "Ramadan", bn: "রমজান" }
            },
            {
                question: { en: "What do Muslims do during Ramadan?", bn: "রমজান মাসে মুসলমানরা কী করে?" },
                options: {
                    en: ["Fast from dawn to sunset", "Eat extra food", "Sleep all day", "Travel"],
                    bn: ["ভোর থেকে সূর্যাস্ত পর্যন্ত রোজা রাখে", "বেশি খাবার খায়", "সারাদিন ঘুমায়", "ভ্রমণ করে"]
                },
                answer: { en: "Fast from dawn to sunset", bn: "ভোর থেকে সূর্যাস্ত পর্যন্ত রোজা রাখে" }
            },
            {
                question: { en: "What is the meal eaten before dawn during Ramadan called?", bn: "রমজানে ভোরে খাওয়া খাবারকে কী বলা হয়?" },
                options: {
                    en: ["Suhoor", "Iftar", "Lunch", "Dinner"],
                    bn: ["সেহরি", "ইফতার", "লাঞ্চ", "ডিনার"]
                },
                answer: { en: "Suhoor", bn: "সেহরি" }
            },
            {
                question: { en: "What is the meal eaten to break the fast called?", bn: "রোজা ভাঙার খাবারকে কী বলা হয়?" },
                options: {
                    en: ["Iftar", "Suhoor", "Breakfast", "Snack"],
                    bn: ["ইফতার", "সেহরি", "ব্রেকফাস্ট", "স্ন্যাকস"]
                },
                answer: { en: "Iftar", bn: "ইফতার" }
            },
            {
                question: { en: "Which holy book was revealed in Ramadan?", bn: "কোন গ্রন্থ রমজান মাসে অবতীর্ণ হয়েছিল?" },
                options: {
                    en: ["Quran", "Torah", "Injeel", "Zabur"],
                    bn: ["কুরআন", "তওরাত", "ইঞ্জিল", "যাবুর"]
                },
                answer: { en: "Quran", bn: "কুরআন" }
            },
            {
                question: { en: "What is the special night in Ramadan when Quran was revealed?", bn: "রমজানে কুরআন অবতীর্ণের বিশেষ রাতকে কী বলা হয়?" },
                options: {
                    en: ["Laylatul Qadr", "Shab-e-Meraj", "Shab-e-Barat", "Eid night"],
                    bn: ["শবে কদর", "শবে মেরাজ", "শবে বরাত", "ঈদের রাত"]
                },
                answer: { en: "Laylatul Qadr", bn: "শবে কদর" }
            },
            {
                question: { en: "Which festival comes after Ramadan?", bn: "রমজানের পর কোন উৎসব আসে?" },
                options: {
                    en: ["Eid-ul-Fitr", "Eid-ul-Adha", "Mawlid", "Hajj"],
                    bn: ["ঈদুল ফিতর", "ঈদুল আযহা", "মওলিদ", "হজ"]
                },
                answer: { en: "Eid-ul-Fitr", bn: "ঈদুল ফিতর" }
            },
            {
                question: { en: "What is the act of giving charity in Ramadan called?", bn: "রমজানে দান করাকে কী বলা হয়?" },
                options: {
                    en: ["Zakat", "Fasting", "Prayer", "Hajj"],
                    bn: ["যাকাত", "রোজা", "নামাজ", "হজ"]
                },
                answer: { en: "Zakat", bn: "যাকাত" }
            },
            {
                question: { en: "How many days does Ramadan typically last?", bn: "রমজান সাধারণত কত দিন স্থায়ী হয়?" },
                options: {
                    en: ["29 or 30 days", "28 days", "31 days", "27 days"],
                    bn: ["২৯ বা ৩০ দিন", "২৮ দিন", "৩১ দিন", "২৭ দিন"]
                },
                answer: { en: "29 or 30 days", bn: "২৯ বা ৩০ দিন" }
            },
            {
                question: { en: "What should Muslims do more during Ramadan?", bn: "রমজানে মুসলমানদের আরও বেশি কী করা উচিত?" },
                options: {
                    en: ["Worship and good deeds", "Sleep", "Play games", "Watch TV"],
                    bn: ["ইবাদত ও ভালো কাজ", "ঘুমানো", "খেলা", "টিভি দেখা"]
                },
                answer: { en: "Worship and good deeds", bn: "ইবাদত ও ভালো কাজ" }
            },
            {
                question: { en: "Who is exempt from fasting during Ramadan?", bn: "রমজানে কারা রোজা থেকে মুক্ত?" },
                options: {
                    en: ["Children, elderly, and sick", "Only children", "Only elderly", "Nobody"],
                    bn: ["শিশু, বৃদ্ধ ও অসুস্থ ব্যক্তি", "শুধু শিশুরা", "শুধু বৃদ্ধরা", "কেউ না"]
                },
                answer: { en: "Children, elderly, and sick", bn: "শিশু, বৃদ্ধ ও অসুস্থ ব্যক্তি" }
            },
            {
                question: { en: "What is the purpose of fasting in Ramadan?", bn: "রমজানে রোজার উদ্দেশ্য কী?" },
                options: {
                    en: ["To gain taqwa (God consciousness)", "To lose weight", "To save money", "To sleep more"],
                    bn: ["তাকওয়া অর্জন করা", "ওজন কমানো", "টাকা বাঁচানো", "বেশি ঘুমানো"]
                },
                answer: { en: "To gain taqwa (God consciousness)", bn: "তাকওয়া অর্জন করা" }
            },
            {
                question: { en: "What do Muslims recite more during Ramadan?", bn: "রমজানে মুসলমানরা আরও বেশি কী পড়ে?" },
                options: {
                    en: ["Quran", "Newspaper", "Novels", "Magazines"],
                    bn: ["কুরআন", "সংবাদপত্র", "উপন্যাস", "ম্যাগাজিন"]
                },
                answer: { en: "Quran", bn: "কুরআন" }
            },
            {
                question: { en: "What is the special prayer in Ramadan called?", bn: "রমজানের বিশেষ নামাজকে কী বলা হয়?" },
                options: {
                    en: ["Taraweeh", "Fajr", "Dhuhr", "Asr"],
                    bn: ["তারাবিহ", "ফজর", "যোহর", "আসর"]
                },
                answer: { en: "Taraweeh", bn: "তারাবিহ" }
            },
            {
                question: { en: "What should be avoided during fasting?", bn: "রোজার সময় কী পরিহার করা উচিত?" },
                options: {
                    en: ["Eating, drinking, and bad deeds", "Only eating", "Only drinking", "Nothing"],
                    bn: ["খাওয়া, পান করা ও খারাপ কাজ", "শুধু খাওয়া", "শুধু পান করা", "কিছুই না"]
                },
                answer: { en: "Eating, drinking, and bad deeds", bn: ["খাওয়া, পান করা ও খারাপ কাজ"] }
            },
            {
                question: { en: "What date is Laylatul Qadr believed to be in the last 10 nights?", bn: "শবে কদর শেষ ১০ রাতের কোন তারিখে বলে বিশ্বাস করা হয়?" },

            // Update question display if quiz is active
            if (!document.getElementById('quizScreen').classList.contains('hidden')) {
                showQuestion();
            }
        }

        function updateLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.textContent = translations[currentLang][key];
                }
            });

            // Update next button text based on progress
            if (!document.getElementById('quizScreen').classList.contains('hidden')) {
                updateNextButtonText();
            }
        }

        function updateNextButtonText() {
            const nextBtn = document.getElementById('nextBtn');
            if (currentQuestionIndex >= shuffledQuestions.length - 1) {
                nextBtn.textContent = translations[currentLang].finish;
            } else {
                nextBtn.textContent = translations[currentLang].next;
            }
        }

        // Settings functions
        function openSettings() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
            questionCount = parseInt(document.getElementById('questionCountSelect').value);
        }

        // High score functions
        function loadHighScore() {
            const highScore = localStorage.getItem('ramadanQuestHighScore') || 0;
            document.getElementById('highScoreValue').textContent = highScore;
        }

        function saveHighScore(newScore) {
            const currentHigh = localStorage.getItem('ramadanQuestHighScore') || 0;
            if (newScore > currentHigh) {
                localStorage.setItem('ramadanQuestHighScore', newScore);
                return true;
            }
            return false;
        }

        // Quiz functions
        function startQuiz() {
            questionCount = parseInt(document.getElementById('questionCountSelect').value);
            shuffledQuestions = shuffleArray([...questions]).slice(0, questionCount);
            currentQuestionIndex = 0;
            score = 0;
            correctCount = 0;
            wrongCount = 0;

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            document.getElementById('resultScreen').classList.add('hidden');

            document.getElementById('totalQuestions').textContent = shuffledQuestions.length;
            document.getElementById('currentScore').textContent = score;

            showQuestion();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function showQuestion() {
            answered = false;
            selectedAnswer = null;
            const question = shuffledQuestions[currentQuestionIndex];

            document.getElementById('questionNum').textContent = currentQuestionIndex + 1;
            document.getElementById('progressFill').style.width = `${((currentQuestionIndex) / shuffledQuestions.length) * 100}%`;
            document.getElementById('questionText').textContent = question.question[currentLang];

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            const options = question.options[currentLang];
            options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => selectAnswer(option, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('nextBtn').classList.add('hidden');
            updateNextButtonText();
        }

        function selectAnswer(answer, btn) {
            if (answered) return;
            answered = true;
            window.KahfBridge && window.KahfBridge.answer();
            selectedAnswer = answer;

            const question = shuffledQuestions[currentQuestionIndex];
            const correctAnswer = question.answer[currentLang];
            const isCorrect = answer === correctAnswer;

            // Show correct/wrong styling
            document.querySelectorAll('.option-btn').forEach(optionBtn => {
                if (optionBtn.textContent === correctAnswer) {
                    optionBtn.classList.add('correct');
                } else if (optionBtn.textContent === answer && !isCorrect) {
                    optionBtn.classList.add('wrong');
                }
            });

            if (isCorrect) {
                correctCount++;
                const points = 100 + Math.floor(Math.random() * 50); // 100-150 points
                score += points;
                showPointsPopup(`+${points}`);
            } else {
                wrongCount++;
            }

            document.getElementById('currentScore').textContent = score;
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function showPointsPopup(text) {
            const popup = document.createElement('div');
            popup.className = 'points-popup';
            popup.textContent = text;
            document.body.appendChild(popup);

            setTimeout(() => popup.remove(), 1000);
        }

        function nextQuestion() {
            currentQuestionIndex++;

            if (currentQuestionIndex >= shuffledQuestions.length) {
                showResults();
            } else {
                showQuestion();
            }
        }

        function showResults() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');

            document.getElementById('finalScore').textContent = score;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;

            const isNewHighScore = saveHighScore(score);
            document.getElementById('newHighScore').style.display = isNewHighScore ? 'inline-block' : 'none';

            if (isNewHighScore) {
                document.getElementById('highScoreValue').textContent = score;
            }
        }

        function restartQuiz() {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            loadHighScore();
        }

        function shareScore() {
            const shareText = translations[currentLang].shareText.replace('{score}', score);

            if (navigator.share) {
                navigator.share({
                    title: translations[currentLang].title,
                    text: shareText,
                    url: window.location.href
                });
            } else {
                // Fallback: copy to clipboard
                navigator.clipboard.writeText(shareText).then(() => {
                    alert('Score copied to clipboard!');
                });
            }
        }
    </script>
</body>
</html>
