<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jannah Garden</title>
<meta name="description" content="Plant roses, palms and fruit trees, add fountains and lanterns, and grow a calm garden. 15 gentle goals in 3 gardens, plus free play with saved gardens.">
<meta name="theme-color" content="#5fb4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/KidsGames/manifest.json">
<link rel="icon" href="/KidsGames/icons/icon-192x192.png">
<link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png">
<style>html,body{margin:0;height:100%;background:#8fcf6e;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
#kit-load{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(#5fb4ee,#cdebf2 38%,#bfe08a 39%,#6fb852);--p:0}
#kit-load svg{width:min(34vw,34vh,180px);height:auto;overflow:visible}
#kit-load .bar{stroke-dasharray:100;stroke-dashoffset:calc(100 * (1 - var(--p)))}
#kit-load .sprout{transform-origin:50px 56px;animation:jg-sway 2.4s ease-in-out infinite}
@keyframes jg-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}</style>
</head>
<body>
<!-- Jannah Garden on Phaser 4 (MIT, pinned in js/vendor), started only by Kit.play (js/kit/play.js).
     game/data.js the things, gardens and 15 goal levels · game/art.js the paint box · game/garden.js the garden (world,
     planting, dragging, goals, saving) · game/hud.js the interface (tray, goals, pause, levels, My Gardens) ·
     game/main.js Boot, sounds and start. Recorded CC0 sounds through Kit.snd (audio/sfx, cut by tools/sound-cut.py). -->
<!-- The loading picture: drawn by the page at once, before the engine downloads: a sprout that sways inside a ring that
     fills (js/kit/load.js moves --p and takes it away when the garden is ready). No words. -->
<div id="kit-load"><svg viewBox="0 0 100 100" aria-hidden="true">
<circle cx="50" cy="50" r="42" fill="rgba(255,255,255,.35)" stroke="rgba(255,255,255,.55)" stroke-width="6"/>
<circle class="bar" cx="50" cy="50" r="42" fill="none" stroke="#f6c453" stroke-width="6" stroke-linecap="round" pathLength="100" transform="rotate(-90 50 50)"/>
<g class="sprout"><path d="M50 72V50" stroke="#3a7d34" stroke-width="5" stroke-linecap="round"/>
<path d="M50 56C38 56 30 48 30 38c11 0 20 7 20 18z" fill="#4fa04a"/><path d="M50 52c0-12 8-20 20-20 0 11-8 20-20 20z" fill="#6fc062"/></g>
</svg></div>
<script src="/KidsGames/js/kit/load.js"></script>
<script src="/KidsGames/js/kahf-bridge.js" defer></script>
<script src="/KidsGames/js/vendor/phaser-4.2.1.min.js" defer></script>
<script src="/KidsGames/js/kit/core.js" defer></script>
<script src="/KidsGames/js/kit/sound.js" defer></script>
<script src="/KidsGames/js/kit/play.js" defer></script>
<script src="/KidsGames/js/kit/praise-clips.js" defer></script>
<script src="game/data.js" defer></script>
<script src="game/art.js" defer></script>
<script src="game/garden.js" defer></script>
<script src="game/hud.js" defer></script>
<script src="game/main.js" defer></script>
</body>
</html>
