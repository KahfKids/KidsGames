<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- KidsGames PWA Support -->
  <link rel="manifest" href="/KidsGames/manifest.json" />
  <meta name="theme-color" content="#4f391a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png" />
  <title>Islamic Good Deeds Game</title>
  <style>
    @import url("/KidsGames/fonts/fonts.css");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #80deea);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      touch-action: manipulation;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      color: #00796b;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .header p {
      color: #00695c;
      font-size: 16px;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .stat-box {
      background-color: white;
      border-radius: 20px;
      padding: 8px 15px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
    }

    .score {
      color: #ff9800;
      font-weight: bold;
    }

    .timer {
      color: #00796b;
      font-weight: bold;
    }

    .game-area {
      position: relative;
      width: 100%;
      height: 400px;
      background: linear-gradient(180deg, #4fc3f7 0%, #29b6f6 100%);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .star {
      position: absolute;
      width: 50px;
      height: 50px;
      cursor: pointer;
      z-index: 10;
    }

    .message-container {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }

    .message {
      background-color: white;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      color: #00796b;
      font-weight: 600;
    }

    .btn {
      background-color: #00897b;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.3s;
      width: 100%;
      margin-bottom: 10px;
    }

    .btn:hover {
      background-color: #00796b;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .mosque {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 22px;
      }

      .game-area {
        height: 350px;
      }

      .mosque {
        width: 100px;
      }
    }
  </style>
  <script src="/KidsGames/js/kahf-bridge.js" defer></script>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Islamic Good Deeds Game</h1>
      <p>Tap the stars to learn about good deeds!</p>
    </div>

    <div class="stats">
      <div class="stat-box score">
        ⭐ <span id="score">0</span>
      </div>
      <div class="stat-box timer">
        Time: <span id="timer">30</span>s
      </div>
    </div>

    <div class="game-area" id="gameArea">
      <!-- Mosque SVG -->
      <svg class="mosque" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path d="M100,20 L140,60 L140,160 L60,160 L60,60 Z" fill="#4A6572"></path>
        <path d="M70,70 L70,160 L90,160 L90,70 Z" fill="#344955"></path>
        <path d="M110,70 L110,160 L130,160 L130,70 Z" fill="#344955"></path>
        <circle cx="100" cy="40" r="15" fill="#F9AA33"></circle>
        <path d="M60,160 L140,160 L130,180 L70,180 Z" fill="#344955"></path>
        <path d="M85,120 L115,120 L115,160 L85,160 Z" fill="#F9AA33"></path>
      </svg>
    </div>

    <div class="message-container">
      <div class="message" id="message">
        Press Start to play!
      </div>
    </div>

    <button class="btn" id="startBtn">Start Game</button>
    <button class="btn" id="restartBtn" style="display: none; background-color: #ff9800;">Play Again</button>
  </div>

  <script>
    // Game elements
    const gameArea = document.getElementById('gameArea');
    const scoreElement = document.getElementById('score');
    const timerElement = document.getElementById('timer');
    const messageElement = document.getElementById('message');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    // Game variables
    let score = 0;
    let timeLeft = 30;
    let gameActive = false;
    let gameTimer;
    let starCreationTimer;

    // Islamic good deeds messages
    const goodDeeds = [
      "Saying 'Bismillah' before eating is Sunnah!",
      "Helping your parents is loved by Allah!",
      "Sharing with others makes Allah happy!",
      "Being honest is an important Islamic value!",
      "Respecting elders is taught in Islam!",
      "Being kind to animals is Islamic teaching!",
      "Saying 'Alhamdulillah' shows gratitude!",
      "Keeping clean is half of faith!",
      "Smiling at others is charity in Islam!",
      "Reading Quran daily is a blessed habit!"
    ];

    // Star SVG template
    const starSVG = `
            <svg width="100%" height="100%" viewBox="0 0 24 24">
                <path fill="#FFD700" d="M12,1.5 L14.5,9 L22.5,9 L16,13.5 L18.5,21 L12,16.5 L5.5,21 L8,13.5 L1.5,9 L9.5,9 Z" />
            </svg>
        `;

    // Start the game
    function startGame() {
      // Reset game state
      score = 0;
      timeLeft = 30;
      gameActive = true;
      scoreElement.textContent = score;
      timerElement.textContent = timeLeft;

      // Clear any existing stars
      clearStars();

      // Show/hide buttons
      startBtn.style.display = 'none';
      restartBtn.style.display = 'none';

      // Show starting message
      updateMessage("Tap the stars to learn about Islamic good deeds!");

      // Start creating stars
      starCreationTimer = setInterval(createStar, 1200);

      // Start the timer
      gameTimer = setInterval(updateTimer, 1000);
    }

    // Update the timer
    function updateTimer() {
      timeLeft--;
      timerElement.textContent = timeLeft;

      if (timeLeft <= 0) {
        endGame();
      }
    }

    // End the game
    function endGame() {
      gameActive = false;
      clearInterval(gameTimer);
      clearInterval(starCreationTimer);

      // Show end message based on score
      if (score >= 15) {
        updateMessage("Masha'Allah! Amazing job! You've learned many good deeds!");
      } else if (score >= 8) {
        updateMessage("Alhamdulillah! Well done! Keep learning more good deeds!");
      } else {
        updateMessage("Good try! Let's learn more Islamic good deeds next time!");
      }

      // Show restart button
      restartBtn.style.display = 'block';
    }

    // Create a star at random position
    function createStar() {
      if (!gameActive) return;

      const star = document.createElement('div');
      star.className = 'star';
      star.innerHTML = starSVG;

      // Calculate random position (with padding from edges)
      const maxX = gameArea.clientWidth - 60;
      const maxY = gameArea.clientHeight - 60;
      const randomX = Math.max(10, Math.floor(Math.random() * maxX));
      const randomY = Math.max(10, Math.floor(Math.random() * (maxY - 100)));

      star.style.left = randomX + 'px';
      star.style.top = randomY + 'px';

      // Add click event
      star.addEventListener('click', function () {
        if (!gameActive) return;

        // Increase score
        score++;
        scoreElement.textContent = score;

        // Show random good deed message
        const randomMessage = goodDeeds[Math.floor(Math.random() * goodDeeds.length)];
        updateMessage(randomMessage);

        // Remove the star
        gameArea.removeChild(star);
      });

      // Add to game area
      gameArea.appendChild(star);

      // Auto-remove after some time
      setTimeout(() => {
        if (star.parentNode === gameArea) {
          gameArea.removeChild(star);
        }
      }, 2500);
    }

    // Update message
    function updateMessage(text) {
      messageElement.textContent = text;
    }

    // Clear all stars
    function clearStars() {
      const stars = document.querySelectorAll('.star');
      stars.forEach(star => star.remove());
    }

    // Event listeners
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
  </script>

  <!-- KidsGames PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/KidsGames/sw.js')
          .then(registration => {
            console.log('[PWA] Service Worker registered for premium game');
          })
          .catch(error => {
            console.log('[PWA] Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>

</html>
