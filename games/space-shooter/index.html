<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Star Rangers</title>
  <meta name="description" content="Fly the ranger ship through 24 waves in four space worlds: dodge asteroids, catch stars and meet four friendly robot bosses." />
  <meta name="theme-color" content="#02040f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/KidsGames/manifest.json" />
  <link rel="icon" href="/KidsGames/icons/icon-192x192.png" />
  <link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png" />
  <link rel="stylesheet" href="/KidsGames/js/kit/kit.css" />
  <script src="/KidsGames/js/kahf-bridge.js" defer></script>
  <style>
    /* six waves per world: 3 wide tiles per row on phones, one row of 6 on wider screens; the boss wave gets a gold ring */
    .kit-levels { grid-template-columns: repeat(3, 1fr); }
    .kit-lv { aspect-ratio: 1.45; }
    .kit-levels .kit-lv:nth-child(6) { box-shadow: inset 0 0 0 3px rgba(246, 196, 83, 0.55); }
    .kit-levels .kit-lv.cur:nth-child(6) { box-shadow: inset 0 0 0 40px rgba(255, 255, 255, 0.16), 0 0 0 3px var(--c, #f6c453); }
    @media (min-width: 470px) { .kit-levels { grid-template-columns: repeat(6, 1fr); } .kit-lv { aspect-ratio: 1; } }
  </style>
</head>
<body>
  <canvas id="stage" class="kit-stage" aria-label="Star Rangers game"></canvas>

  <script src="/KidsGames/js/kit/core.js"></script>
  <script src="/KidsGames/js/kit/fx.js"></script>
  <script src="/KidsGames/js/kit/audio.js"></script>
  <script src="/KidsGames/js/kit/ui.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/art.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>

  <script>
    if ("serviceWorker" in navigator && location.pathname.indexOf("/KidsGames/") === 0 && !/[?&](debug|nosw)\b/.test(location.search)) {
      addEventListener("load", function () { navigator.serviceWorker.register("/KidsGames/sw.js").catch(function () {}); });
    }
  </script>
</body>
</html>
