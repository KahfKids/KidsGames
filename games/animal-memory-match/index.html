<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Memory Match</title>
<meta name="description" content="Memory Match: Animals of the Quran. Turn two cards and find the same animal, across 24 levels in 4 worlds.">
<meta name="theme-color" content="#0d0b24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/KidsGames/manifest.json">
<link rel="icon" href="/KidsGames/icons/icon-192x192.png">
<link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png">
<style>html,body{margin:0;height:100%;background:#0d0b24;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
#kit-load{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0d0b24;--p:0}
#kit-load svg{width:min(34vw,34vh,180px);height:auto}
#kit-load .bar{stroke-dasharray:100;stroke-dashoffset:calc(100 * (1 - var(--p)))}
#kit-load .c1{animation:mm-tilt 1.8s ease-in-out infinite;transform-origin:50px 50px}
#kit-load .c2{animation:mm-tilt 1.8s ease-in-out infinite reverse;transform-origin:50px 50px}
@keyframes mm-tilt{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(-6deg)}}</style>
</head>
<body>
<!-- Memory Match on Phaser 4 (MIT, pinned in js/vendor), started only by Kit.play (js/kit/play.js) with rest mode: the loop
     sleeps while the child thinks. Pictures are painted once into textures (game/art.js, animals in game/animals.js),
     sounds are recordings through Kit.snd (audio/sfx, cut by tools/sound-cut.py).
     game/play.js the table and cards · game/hud.js the interface · game/main.js Boot, save, start. -->
<!-- The loading picture: drawn by the page at once, before the engine downloads: two paper cards in a ring that fills
     (js/kit/load.js moves --p and takes it away when the first level is ready). No words. -->
<div id="kit-load"><svg viewBox="0 0 100 100" aria-hidden="true">
<circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/>
<circle class="bar" cx="50" cy="50" r="44" fill="none" stroke="#f6c453" stroke-width="5" stroke-linecap="round" pathLength="100" transform="rotate(-90 50 50)"/>
<g class="c1"><rect x="26" y="30" width="26" height="38" rx="5" fill="#c25f35" stroke="#fbe3a8" stroke-width="2"/></g>
<g class="c2" style="transform:translate(10px,-2px)"><rect x="40" y="30" width="26" height="38" rx="5" fill="#fffaf0" stroke="#e9b44c" stroke-width="2"/><path d="M53 41l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" fill="#f6c453"/></g>
</svg></div>
<script src="/KidsGames/js/kit/load.js"></script>
<script src="/KidsGames/js/kahf-bridge.js" defer></script>
<script src="/KidsGames/js/vendor/phaser-4.2.1.min.js" defer></script>
<script src="/KidsGames/js/kit/core.js" defer></script>
<script src="/KidsGames/js/kit/sound.js" defer></script>
<script src="/KidsGames/js/kit/play.js" defer></script>
<script src="game/animals.js" defer></script>
<script src="game/art.js" defer></script>
<script src="game/levels.js" defer></script>
<script src="game/play.js" defer></script>
<script src="game/hud.js" defer></script>
<script src="game/main.js" defer></script>
</body>
</html>
