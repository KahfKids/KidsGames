<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ramadan Maze</title>
<meta name="description" content="Walk home through 30 mazes, gather dates on the way and arrive in time for iftar.">
<meta name="theme-color" content="#0d0b24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/KidsGames/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/KidsGames/icons/icon-32x32.png">
<link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png">
<style>html,body{margin:0;height:100%;background:#0d0b24;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
#kit-load{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0d0b24;--p:0}
#kit-load svg{width:min(34vw,34vh,180px);height:auto}
#kit-load .bar{stroke-dasharray:100;stroke-dashoffset:calc(100 * (1 - var(--p)))}
#kit-load .moon{animation:rm-glow 1.8s ease-in-out infinite;transform-origin:50px 50px}
@keyframes rm-glow{0%,100%{transform:scale(.94);opacity:.85}50%{transform:scale(1.04);opacity:1}}</style>
</head>
<body>
<!-- Ramadan Maze on Phaser 4 (MIT, pinned in js/vendor), started only by Kit.play (js/kit/play.js).
     Arcade physics for the walls and the kid; recorded CC0 sounds through Kit.snd (audio/sfx, cut by tools/sound-cut.py).
     game/levels.js the 30 mazes (rules only) · game/art.js the paint box · game/maze.js one maze · game/hud.js the interface
     game/iftar.js the iftar screen · game/main.js Boot, saved progress, offline and Kit.play.start. -->
<!-- The loading picture: drawn by the page at once, before the engine downloads; a crescent that glows while its ring fills
     (js/kit/load.js moves --p and takes it away when the first maze is ready). No words. -->
<div id="kit-load"><svg viewBox="0 0 100 100" aria-hidden="true">
<circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/>
<circle class="bar" cx="50" cy="50" r="40" fill="none" stroke="#f6c453" stroke-width="6" stroke-linecap="round" pathLength="100" transform="rotate(-90 50 50)"/>
<defs><radialGradient id="rm-g" cx=".38" cy=".38" r=".8"><stop offset="0" stop-color="#fff3c8"/><stop offset=".6" stop-color="#f6c453"/><stop offset="1" stop-color="#d89a2b"/></radialGradient></defs>
<path class="moon" d="M58 30a21 21 0 1 0 0 40a16 16 0 1 1 0-40z" fill="url(#rm-g)"/>
</svg></div>
<script src="/KidsGames/js/kit/load.js"></script>
<script src="/KidsGames/js/kahf-bridge.js" defer></script>
<script src="/KidsGames/js/vendor/phaser-4.2.1.min.js" defer></script>
<script src="/KidsGames/js/kit/core.js" defer></script>
<script src="/KidsGames/js/kit/sound.js" defer></script>
<script src="/KidsGames/js/kit/play.js" defer></script>
<script src="game/levels.js" defer></script>
<script src="game/art.js" defer></script>
<script src="game/maze.js" defer></script>
<script src="game/hud.js" defer></script>
<script src="game/iftar.js" defer></script>
<script src="game/main.js" defer></script>
</body>
</html>
