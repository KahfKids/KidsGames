<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mosaic Breaker</title>
<meta name="description" content="Fly the magic carpet, bounce the star and break glowing mosaic tiles across 30 levels.">
<meta name="theme-color" content="#0d0b24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/KidsGames/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/KidsGames/icons/icon-32x32.png">
<link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png">
<style>html,body{margin:0;height:100%;background:#0d0b24;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
#kit-load{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0d0b24;--p:0}
#kit-load svg{width:min(34vw,34vh,180px);height:auto}
#kit-load .bar{stroke-dasharray:100;stroke-dashoffset:calc(100 * (1 - var(--p)))}
#kit-load .star{animation:mb-glow 1.6s ease-in-out infinite;transform-origin:50px 50px}
@keyframes mb-glow{0%,100%{transform:scale(.9) rotate(0);opacity:.85}50%{transform:scale(1.06) rotate(22deg);opacity:1}}</style>
</head>
<body>
<!-- Mosaic Breaker on Phaser 4 (MIT, pinned in js/vendor), started only by Kit.play (js/kit/play.js).
     Arcade physics: the star is a circle body that bounces off the walls, tiles (a static group) and the carpet; recorded
     CC0 sounds through Kit.snd (audio/sfx, cut by tools/sound-cut.py).
     game/art.js the paint box · game/levels.js the 30 levels · game/play.js the field · game/hud.js the interface ·
     game/main.js Boot, saved progress and start. -->
<!-- The loading picture: drawn by the page at once, before the engine downloads; a glowing eight-point star in a ring that
     fills (js/kit/load.js moves --p and takes it away when the first level is ready). No words. -->
<div id="kit-load"><svg viewBox="0 0 100 100" aria-hidden="true">
<circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/>
<circle class="bar" cx="50" cy="50" r="40" fill="none" stroke="#f6c453" stroke-width="6" stroke-linecap="round" pathLength="100" transform="rotate(-90 50 50)"/>
<defs><radialGradient id="mb-g" cx=".38" cy=".38" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff1b8"/><stop offset="1" stop-color="#f2b23a"/></radialGradient></defs>
<path class="star" fill="url(#mb-g)" d="M50 28 55.7 36.1 65.5 36.5 64 46.2 72 52 64 57.8 65.5 67.5 55.7 67.9 50 76 44.3 67.9 34.5 67.5 36 57.8 28 52 36 46.2 34.5 36.5 44.3 36.1Z"/>
</svg></div>
<script src="/KidsGames/js/kit/load.js"></script>
<script src="/KidsGames/js/kahf-bridge.js" defer></script>
<script src="/KidsGames/js/vendor/phaser-4.2.1.min.js" defer></script>
<script src="/KidsGames/js/kit/core.js" defer></script>
<script src="/KidsGames/js/kit/sound.js" defer></script>
<script src="/KidsGames/js/kit/play.js" defer></script>
<script src="game/levels.js" defer></script>
<script src="game/art.js" defer></script>
<script src="game/play.js" defer></script>
<script src="game/hud.js" defer></script>
<script src="game/main.js" defer></script>
</body>
</html>
