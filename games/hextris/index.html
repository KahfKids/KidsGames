<!DOCTYPE html>

  new art and recorded sounds.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hextris</title>
<meta name="description" content="Turn the tile medallion and match three glazed tiles of the same colour. 15 levels and an endless mode.">
<meta name="theme-color" content="#04161f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/KidsGames/manifest.json">
<link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png">
<link rel="icon" href="/KidsGames/icons/icon-32x32.png">
<style>html,body{margin:0;height:100%;background:#04161f;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
#kit-load{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#04161f;--p:0}
#kit-load svg{width:min(34vw,34vh,180px);height:auto}
#kit-load .bar{stroke-dasharray:100;stroke-dashoffset:calc(100 * (1 - var(--p)))}
#kit-load .gem{animation:hx-glow 1.6s ease-in-out infinite;transform-origin:50px 50px}
@keyframes hx-glow{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1.05);opacity:1}}</style>
</head>
<body>
<!-- Hextris on Phaser 4 (MIT, pinned in js/vendor), started only by Kit.play (js/kit/play.js). Recorded CC0 sounds through
     Kit.snd (audio/sfx, cut by tools/sound-cut.py). game/rules.js the rules · levels.js the levels · art.js the paint box ·
     play.js the courtyard and the tiles · ingame.js the interface while playing · hud.js the screens · main.js Boot and start. -->
<!-- The loading picture: drawn by the page at once, before the engine downloads; a hexagon whose outline fills round a glowing
     gem (js/kit/load.js moves --p and takes it away when the first level is ready). No words. -->
<div id="kit-load"><svg viewBox="0 0 100 100" aria-hidden="true">
<path d="M50 8 86.4 29 86.4 71 50 92 13.6 71 13.6 29Z" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6" stroke-linejoin="round"/>
<path class="bar" d="M50 8 86.4 29 86.4 71 50 92 13.6 71 13.6 29Z" fill="none" stroke="#5fe0cf" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" pathLength="100"/>
<defs><radialGradient id="hx-g" cx=".38" cy=".38" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#ffd36b"/><stop offset="1" stop-color="#b36d12"/></radialGradient></defs>
<path class="gem" d="M50 32 65.6 41 65.6 59 50 68 34.4 59 34.4 41Z" fill="url(#hx-g)"/>
</svg></div>
<script src="/KidsGames/js/kit/load.js"></script>
<script src="/KidsGames/js/kahf-bridge.js" defer></script>
<script src="/KidsGames/js/vendor/phaser-4.2.1.min.js" defer></script>
<script src="/KidsGames/js/kit/core.js" defer></script>
<script src="/KidsGames/js/kit/sound.js" defer></script>
<script src="/KidsGames/js/kit/play.js" defer></script>
<script src="game/rules.js" defer></script>
<script src="game/levels.js" defer></script>
<script src="game/art.js" defer></script>
<script src="game/play.js" defer></script>
<script src="game/ingame.js" defer></script>
<script src="game/hud.js" defer></script>
<script src="game/main.js" defer></script>
</body>
</html>
