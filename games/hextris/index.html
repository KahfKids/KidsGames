<!DOCTYPE html>
<!--
  Hextris, Kahf Kids edition.
  Based on Hextris by Logan Engstrom and Garrett Finucane (https://github.com/Hextris/hextris),
  free software under the GNU General Public License v3. This modified version is also GPL v3:
  see LICENSE.md in this folder. Changes: rebuilt on the Kahf KidsGames kit with a delta-time loop,
  kid mode, 15 levels and endless mode, new art and sounds.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Hextris</title>
  <meta name="description" content="Turn the tile medallion and match three glazed tiles of the same colour. 15 levels and an endless mode." />
  <meta name="theme-color" content="#04161f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/KidsGames/manifest.json" />
  <link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png" />
  <link rel="icon" href="/KidsGames/icons/icon-32x32.png" />
  <link rel="stylesheet" href="/KidsGames/js/kit/kit.css" />
  <script src="/KidsGames/js/kahf-bridge.js" defer></script>
  <style>
    .kit-pill .hx-bar { display: inline-block; width: 38px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; margin-left: 2px; }
    .kit-pill .hx-bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #ffd36b, #f39a3a); transition: width .4s; }
    .hx-endless { width: 100%; margin-top: 18px; gap: 10px; }
    .hx-endless small { font-size: 15px; font-weight: 800; color: var(--kit-ink-dim); }
    .hx-about p { margin: 10px 0 0; }
    .hx-how { display: flex; justify-content: center; gap: 12px; margin-top: 14px; }
    .hx-how span { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 18px; background: rgba(255,255,255,.08); font-size: 18px; }
    .hx-how svg { width: 24px; height: 24px; }
    .kit-sheet p.hx-credit { font-size: 13px; font-weight: 600; line-height: 1.35; margin-top: 14px; }
    @media (max-width: 430px) { .kit-pill { padding: 0 10px; } .kit-pill .hx-bar { width: 22px; } .kit-hud { gap: 6px; } }
    @media (max-width: 370px) { .kit-pill .hx-bar { display: none; } }
  </style>
</head>
<body>
  <canvas id="stage" class="kit-stage" aria-label="Hextris game"></canvas>

  <script src="/KidsGames/js/kit/core.js"></script>
  <script src="/KidsGames/js/kit/fx.js"></script>
  <script src="/KidsGames/js/kit/audio.js"></script>
  <script src="/KidsGames/js/kit/ui.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/art.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>

  <script>
    if ("serviceWorker" in navigator && location.pathname.indexOf("/KidsGames/") === 0 && !/[?&](debug|nosw)\b/.test(location.search)) {
      addEventListener("load", function () { navigator.serviceWorker.register("/KidsGames/sw.js").catch(function () {}); });
    }
  </script>
</body>
</html>
