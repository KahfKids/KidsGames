<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sharp Eyes</title>
<meta name="description" content="Spot the odd one out! Find the one picture that is different, across 30 levels in 3 worlds.">
<meta name="theme-color" content="#0d0b24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/KidsGames/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/KidsGames/icons/icon-32x32.png">
<link rel="apple-touch-icon" href="/KidsGames/icons/icon-192x192.png">
<style>html,body{margin:0;height:100%;background:#0d0b24;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
#kit-load{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0d0b24;--p:0}
#kit-load svg{width:min(34vw,34vh,180px);height:auto}
#kit-load .bar{stroke-dasharray:100;stroke-dashoffset:calc(100 * (1 - var(--p)))}
#kit-load .star{animation:se-glow 1.6s ease-in-out infinite;transform-origin:50px 50px}
@keyframes se-glow{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1.05);opacity:1}}</style>
</head>
<body>
<!-- Sharp Eyes on Phaser 4 (MIT, pinned in js/vendor), started only by Kit.play (js/kit/play.js).
     game/items.js the things and the measured differences · game/levels.js 30 levels · game/art.js the paint box
     game/play.js the board (scene Play) · game/hud.js the interface (scene Hud) · game/main.js Boot, saving, offline, start.
     Recorded CC0 sounds through Kit.snd (audio/sfx, cut by tools/sound-cut.py). -->
<!-- The loading picture: drawn by the page at once, before the engine downloads; a gold star that glows while its ring fills
     (js/kit/load.js moves --p and takes it away when the first level is ready). No words. -->
<div id="kit-load"><svg viewBox="0 0 100 100" aria-hidden="true">
<circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/>
<circle class="bar" cx="50" cy="50" r="40" fill="none" stroke="#ffd36b" stroke-width="6" stroke-linecap="round" pathLength="100" transform="rotate(-90 50 50)"/>
<defs><linearGradient id="se-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".55" stop-color="#f6c453"/><stop offset="1" stop-color="#e08a2a"/></linearGradient></defs>
<path class="star" fill="url(#se-g)" stroke="#7a4a12" stroke-width="1.6" stroke-linejoin="round" d="M50 29 55.7 36 64.6 35.4 64 44.3 71 50 64 55.7 64.6 64.6 55.7 64 50 71 44.3 64 35.4 64.6 36 55.7 29 50 36 44.3 35.4 35.4 44.3 36Z"/>
</svg></div>
<script src="/KidsGames/js/kit/load.js"></script>
<script src="/KidsGames/js/kahf-bridge.js" defer></script>
<script src="/KidsGames/js/vendor/phaser-4.2.1.min.js" defer></script>
<script src="/KidsGames/js/kit/core.js" defer></script>
<script src="/KidsGames/js/kit/sound.js" defer></script>
<script src="/KidsGames/js/kit/play.js" defer></script>
<script src="game/items.js" defer></script>
<script src="game/levels.js" defer></script>
<script src="game/art.js" defer></script>
<script src="game/common.js" defer></script>
<script src="game/play.js" defer></script>
<script src="game/hud.js" defer></script>
<script src="game/main.js" defer></script>
</body>
</html>
